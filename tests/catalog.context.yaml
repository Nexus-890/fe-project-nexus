    status: supported
    claim: The rebuilt frontend reads documented numeric-money envelopes and preserves typed HTTP failures in the exercised catalog scenarios.
    reason: The real getProduct service and requestApi Axios code were run against the existing catalog mock derived from delivered OpenAPI; five request events confirm routing through the stand-in.
    verification: On 2026-10-30 with fingerprint rebuild-251, the optional product-detail unit probe passed product 200, SKU 200, SKU 404 and 503 symbolic errors, and rejection of a deliberately malformed bare success. This proves caller behavior against the stand-in, not live gateway authorization or database behavior.
