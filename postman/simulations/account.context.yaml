purpose:
  stands_in_for: >-
    Existing OIDC/session/checkout fixtures plus account operations aligned to backend #210 commit
    1e480dda. Seller lifecycle fixtures now implement the explicitly proposed own-application read
    and complete DTO in docs/api/seller-application-210.openapi.json; backend #210 has not delivered
    those operations.
  unblocks: >-
    Real frontend browser checks for #219 account screens and saved-address checkout behavior before
    the owning backend contract becomes available.
assumptions:
  - id: account-provisional-contract
    status: contradicted
    claim: >-
      The provisional resource paths and shapes documented by the account frontend will match the
      eventual #210 delivered API and #257 seller profile.
    reason: >-
      Review and inspection of #210 commit 1e480dda found the former assumed OTP/resend/default
      paths and payloads incompatible. This historical assumption is superseded by the pinned
      snapshot and corrected calls.
    verification: >-
      Inspected user-service OpenAPI/controllers on develop 09b3cf6f on 2026-11-13. Reused existing
      local OIDC/checkout mocks. postman status is unavailable in installed CLI 1.73.0, so owner
      workspace discovery was skipped; no mock was published or deployed. Contract agreement, live
      persistence, OTP storage/rate limits and admin authorization remain #210. On 2026-11-14
      compared controllers and DTOs on 1e480dda with FE; corrected resend to POST
      verification-email/204, OTP to phone/verification with no send body and code-only confirm,
      default address to POST and wire phone/timestamps.
    source: >-
      service/verificationService.ts; service/sellerApplicationService.ts;
      service/addressBookService.ts; docs/features/seller-application.md;
      docs/features/address-book.md; postman/mocks/account-api/handler.js;
      ../be-project-nexus/docs/api/openapi/user-service.yaml
    updated_at: '2026-11-14'
  - id: seller-ui-local-behavior
    status: supported
    claim: >-
      Historical submission-only behavior on 8a86cf26: the frontend submitted company/contact/note,
      handled duplicate acknowledgement and opened seller back office for an existing SELLER token.
      This behavior did not restore application status after reload and is superseded by
      seller-own-status-proposal.
    reason: >-
      Tests run the actual Next frontend and its shared HTTP/session boundary against local Postman
      dependencies. The handler checks the issued access token's hash, persists application state
      and records request outcomes. The original fixture guessed the account contract; these
      historical passes do not establish compatibility with #210. Current validation is recorded
      separately. The follow-up review identified the missing authoritative own read; original
      no-GET behavior is no longer the current frontend.
    verification: >-
      The earlier submission-only implementation passed historical scenarios before review. It is
      superseded. The corrected full account run is recorded in seller-own-status-proposal.
    source: >-
      tests/account.spec.ts; postman/mocks/account-api/handler.js;
      features/SellerApplicationPage.tsx; test-results/account-simulation.ndjson
    updated_at: '2026-11-14'
  - id: verification-ui-local-behavior
    status: supported
    claim: >-
      In corrected account scenarios with the #210 contract enabled, the frontend sends public POST
      verification-email and handles 204, sends bodyless POST phone/verification, confirms
      code-only, maps phoneVerifiedAt and saves changed phone through profile PUT.
    reason: >-
      Browser tests exercise real HTTP serialization and UI feedback with stateful dependency
      responses. Sixth incorrect attempt and fourth send failures are modeled by the stand-in; live
      enforcement and SMS/email delivery remain unknown. OTP/password inputs are excluded from the
      fixture's evidence body. The original fixture guessed the account contract; these historical
      passes do not establish compatibility with #210. Current validation is recorded separately.
    verification: >-
      Final corrected npm run test:account passed 23 scenarios, including resend 204,
      registration-send-failure recovery without duplicate registration, phone code failures,
      expiry, rate limits and changed-phone PUT. Evidence is fixture-only; native Keycloak/Mailpit
      password/verification checks are recorded separately.
    source: >-
      tests/account.spec.ts; features/PhoneVerificationCard.tsx; features/CheckEmailPage.tsx;
      postman/mocks/account-api/handler.js
    updated_at: '2026-11-14'
  - id: address-ui-local-behavior
    status: supported
    claim: >-
      In corrected account scenarios with #210 enabled, the frontend maps wire phone/timestamps and
      page metadata, sends POST default, preserves locality codes and supports address CRUD/manual
      checkout fallback.
    reason: >-
      The actual frontend writes and reads state through Postman HTTP fixtures. The browser compares
      checkout payload codes and modeled quote results; a delayed GET tests the ordering race. This
      supports caller behavior in those scenarios, not real cross-user isolation, concurrent max-ten
      enforcement, persistence or GHN pricing. The original fixture guessed the account contract;
      these historical passes do not establish compatibility with #210. Current validation is
      recorded separately.
    verification: >-
      Final corrected npm run test:account passed 23 scenarios, including all six address cases.
      Focused unit tests verify phone/timestamps, page metadata, POST default, validation and quote
      equivalence. Events are fixture-only; ownership and persistence remain backend acceptance.
    source: >-
      tests/account-addresses.spec.ts; features/AddressesPage.tsx; features/CheckoutPage.tsx;
      postman/mocks/account-api/addresses.js; test-results/account-simulation.ndjson;
      test-results/account/http-summary.json
    updated_at: '2026-11-14'
  - id: review-source-alignment
    status: supported
    claim: >-
      Email, phone and address caller paths, bodies and parsed data match the pinned unmerged #210
      controllers/DTOs; default develop never invokes these operations unless explicitly enabled.
    reason: >-
      Compared source and extracted exact selected OpenAPI into docs/api/account-210.openapi.json,
      generated aliases, default-off guards and tests for both configurations. Seller issue reserves
      list reads for Admin, so the buyer never calls that list.
    verification: >-
      Source/controller review on 2026-11-14 at 1e480dda. Lint, typecheck, generated drift check and
      286 unit tests passed. Corrected account browser run passed 23 scenarios; checkout passed 24;
      catalog passed 55 with 38 configured skips. Default develop registration remains sign-in and
      default-off account routes make no unsupported requests. Backend persistence/OTP
      enforcement/seller lifecycle remain unverified.
    source: >-
      docs/api/account-210.openapi.json; service/verificationService.ts;
      service/addressBookService.ts; configs/account.ts; tests/verification.test.ts;
      docs/api/seller-application-210.md
    updated_at: '2026-11-14'
  - id: seller-own-status-proposal
    status: supported
    claim: >-
      In 23 local account browser scenarios, the frontend reads its own full application after
      reload/navigation, shows stored rejection feedback, reapplies with the same record, refetches
      after 409, supports read/write retry and keeps two JWT subjects separate.
    reason: >-
      Actual Next frontend uses its shared HTTP boundary against stateful Postman dependencies. The
      own-read/full-resource API is an explicit proposal authorized by the user as frontend/contract
      work; test controls represent backend Admin decisions, not real Admin APIs.
    verification: >-
      On 2026-11-14 npm run test:account passed 23/23 (ten seller scenarios plus the existing
      address/email/OTP scenarios). The seller cases verify reload without another POST, persisted
      rejection feedback, same-ID reapplication with reason cleared, navigation-away/refetch, GET
      retry, POST retry, duplicate refetch, ACTIVE sign-in, existing seller access and two distinct
      JWT subjects. Screenshots and raw fixture evidence are preserved under the task visualization
      folder. The fixture represents Admin decisions through a test-only control and does not
      establish a real Admin endpoint or database.
    source: >-
      docs/api/seller-application-210.openapi.json; service/sellerApplicationService.ts;
      features/SellerApplicationPage.tsx; tests/seller-application.test.ts; tests/account.spec.ts;
      postman/mocks/account-api/handler.js
    updated_at: '2026-11-14'
  - id: seller-own-status-backend-availability
    status: unknown
    claim: >-
      Backend #210 will implement the proposed own-read/full DTO, persisted rejection feedback and
      same-record rejected resubmission with JWT subject ownership and Admin-only decisions.
    reason: >-
      The user explicitly kept backend implementation with #210. No seller controller/migration is
      delivered in develop09b3cf6f or backend210head1e480dda. Frontend behavior and a fixture cannot
      establish that backend contract or its authorization.
    verification: >-
      Inspected repository refs on 2026-11-14 and recorded user frontend+contract-only scope.
      Proposed OpenAPI is separate from delivered API specs and the seller feature remains disabled
      by default.
    source: >-
      docs/api/seller-application-210.md; docs/api/seller-application-210.openapi.json;
      configs/account.ts
    updated_at: '2026-11-14'
