purpose:
  stands_in_for: >-
    Existing local OIDC provider fixture and a local API fixture for delivered
    profile/cart/catalog reads plus provisional #201 shipping lists and #188
    checkout preview, delivered order-creation/replay and price conflicts,
    and forced future inventory conflicts. These fixtures do not represent
    a real carrier quote or inventory reservation.
  unblocks: >-
    Browser verification of task #150 address validation, dependent locality
    selectors, cart snapshot prices, quote refresh/error/session behavior and
    responsive layout before those backend dependencies are merged; also #151
    idempotency, explicit price confirmation, stock feedback and order-group
    payment navigation against the local dependency model.
assumptions:
  - id: checkout-contract-boundary
    status: unknown
    claim: >-
      The future shipping lists use code/name arrays with sibling page metadata
      and preview accepts the draft #188 address names and returns numeric
      item/amount fields plus a nullable shippingFee.
    reason: >-
      Shipping #201 has no delivered controller/OpenAPI on develop 0d0a36a4.
      The #188 branch is unmerged and returns shippingFee null. The locality
      wire fields and ward-sensitive fees are explicit development assumptions,
      not evidence about the eventual provider behavior.
    verification: >-
      On 2026-11-04 inspected delivered commerce OpenAPI/controllers and the
      remote #188 draft contract. Authenticated profile/cart responses reuse
      the delivered success envelope. Browser execution was pending at initial
      creation. The final checkout-browser-verification run passed all 13
      local scenarios, but those simulated responses still cannot establish
      the future provider contract or a real ward-sensitive carrier fee.
    source: >-
      service/checkoutService.ts; types/checkoutType.ts;
      postman/mocks/checkout-api/default.js;
      ../be-project-nexus/docs/api/openapi/commerce-service.yaml;
      remote #188 commit 64be1db3
    updated_at: "2026-11-04"
  - id: checkout-local-simulation-coverage
    status: supported
    claim: >-
      In the 13 local browser scenarios exercised, the actual application
      validates required address fields before preview, filters locality
      children by codes, updates shipping/total for the selected ward,
      suppresses stale/session-obsolete quotes and remains usable at 375x812.
    reason: >-
      tests/checkout.spec.ts exercises the actual application against local
      HTTP dependencies. All 13 scenarios passed against the final dirty
      checkout implementation. The API verifies Bearer hashes against tokens
      actually issued by the reused OIDC fixture, and records preview/order
      requests for no-write assertions. This demonstrates frontend behavior
      under the modeled scenarios rather than compatibility with live backend,
      carrier pricing or deployed authentication services.
    verification: >-
      Created tests and local simulation on 2026-11-04. npm run test:checkout
      passed all 13 scenarios at the checkout-browser-verification fingerprint,
      including focus on the first invalid field, no preview/order submission
      for an empty address, profile-only text prefill, two-line snapshot
      prices, dependent codes, changing ward fees, delayed obsolete quotes,
      district retry, Problem Details field mapping and quote retry, nullable
      fees, malformed/inconsistent previews, metadata fallback, mobile target
      geometry and logout while a quote was pending. The initial invocation
      stopped at the existing Next.js package security reminder; the unchanged
      retry passed. A final run after implementation review passed all 13
      scenarios again and produced the preserved log inspected here. It
      contains one listening event and 353 HTTP request events: 279 for the API
      member and 74 for Keycloak. The actual preview path received 16 POSTs:
      14 HTTP 200 responses (including invalid-data exercises), one 400 field
      error and one 503 quote failure. Two old Ward 4 responses completed after
      about 1.4 seconds in the quote-race/logout scenarios. There were zero
      POST /orders requests and zero HTTP 401 responses. Captured screenshots
      were visually reviewed at desktop 1440px and mobile 375x812; mobile
      assertions found no horizontal overflow and all visible main-content
      controls measured at least 44x44px. Logs and screenshots were preserved
      in the task-local checkout-150 artifact folder before other browser
      runners cleaned test-results. Real #188/#201 integration remains pending.
    source: >-
      tests/checkout.spec.ts; playwright.checkout.config.ts;
      tests/checkout-fixture.mjs; postman/mocks/checkout-api/default.js;
      test-results/checkout-simulation.ndjson (ignored local run evidence,
      preserved in the task-local checkout-150 artifact folder);
      checkout-desktop-1440.png; checkout-mobile-375x812.png
    updated_at: "2026-11-04"
  - id: checkout-mock-provenance
    status: supported
    claim: >-
      This simulation uses repository-owned local mocks and no published owner
      mock was searched or downloaded during the task.
    reason: >-
      The existing Postman CLI 1.73.0 rejects postman status as an unknown
      command, so signed-in owner discovery was not established. The already
      committed OIDC fixture is reused and the checkout handler states its
      provisional contract assumptions explicitly. No remote workspace change
      or deployment is needed for local browser verification.
    verification: >-
      On 2026-11-04 postman --version returned 1.73.0, while postman status
      returned unknown command. Read api-simulation and api-mocking guidance;
      selected the supported local simulation command with --port because
      browser clients do not honor an environment HTTP proxy automatically.
    source: >-
      postman/simulations/checkout.sim.yaml;
      postman/mocks/checkout-api/config.yaml;
      postman/mocks/oidc-keycloak/config.yaml
    updated_at: "2026-11-04"
  - id: checkout-develop-cookie-integration-20261106
    status: supported
    claim: The checkout scenarios use the current gateway cookie session lifecycle after merging develop.
    reason: The actual frontend runs against the existing repository OIDC gateway and checkout HTTP stand-ins.
    verification: >-
      On 2026-11-06, generated-type check, lint, typecheck, 180 unit tests and all
      13 checkout browser scenarios passed. The simulation recorded 381 requests,
      including 27 session-member calls and 16 previews, with zero order writes.
      Preview #188 is now delivered; shipping #201 and carrier fees remain modeled.
      Live backend and carrier acceptance were not exercised.
    source: tests/checkout.spec.ts; postman/mocks/oidc-api/default.js; postman/mocks/checkout-api/default.js
    updated_at: "2026-11-06"
  - id: order-delivered-idempotency-contract
    status: supported
    claim: >-
      The delivered commerce contract promises 201 for a new order group and
      200 with the original group for the same buyer, UUID key and unchanged
      shipping/payment body when order idempotency is enabled.
    reason: >-
      Delivered OpenAPI and OrderService implement the same key/body behavior,
      including replay before current cart/price checks. This is source and
      contract evidence, not a live deployment observation or a guarantee when
      ORDER_IDEMPOTENCY_ENABLED is disabled.
    verification: >-
      On 2026-11-04 read the POST /api/v1/orders contract and controller/service
      at the place-order-browser-verification fingerprint. Price conflict
      commits only the reported cart-price update and creates no order; a
      confirmed request must use a new key. Money extension fields are numeric
      VND amounts, not minor units.
    source: >-
      ../be-project-nexus/docs/api/openapi/commerce-service.yaml;
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/service/OrderService.java;
      service/checkoutService.ts
    updated_at: "2026-11-04"
  - id: order-inventory-conflict-contract
    status: unknown
    claim: >-
      The eventual inventory integration returns COMMERCE_INSUFFICIENT_STOCK
      with a SKU identity and optionally a product name, allowing checkout to
      identify the sold-out item.
    reason: >-
      The delivered inventory client is a stub and the current commerce
      contract has no COMMERCE_INSUFFICIENT_STOCK response. The local handler
      deliberately forces this future branch as requested by #151. A passing
      caller scenario cannot establish the future provider's wire fields.
    verification: >-
      On 2026-11-04 inspected the delivered commerce source/OpenAPI and modeled
      forced stock failures with skuId and optional productName. A real
      reservation rejection with an agreed Problem Details extension is still
      needed before claiming live inventory compatibility.
    source: >-
      postman/mocks/checkout-api/default.js; tests/place-order.spec.ts;
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/service/OrderService.java
    updated_at: "2026-11-04"
  - id: order-local-simulation-coverage
    status: supported
    claim: >-
      In the final 24 local browser scenarios, the actual frontend preserves
      address/quote behavior, prevents duplicate click writes, reuses the same
      key/body after an uncertain persisted order, explicitly confirms new
      prices with a new key, names forced sold-out items, and opens one payment
      destination for a group of two seller orders.
    reason: >-
      The real Next application and shared HTTP boundary ran against the local
      dependency simulation. Assertions inspect recorded keys, request bodies,
      statuses and group count, including a reconnect that empties the cart and
      rejects the preview before same-key replay. These findings concern the
      modeled dependencies, not deployed commerce, actual inventory or QR payment.
    verification: >-
      On 2026-11-04 the final direct Playwright checkout config passed 24/24
      scenarios in 59.4 seconds at place-order-browser-verification, using API
      port 3923, application port 3113 and isolated .next-checkout-151-run output
      while preserving the existing development servers. This includes 13
      address/quote regressions and 11 order scenarios. The final simulation log
      has one listening event and 719 HTTP requests: 578 API and 141 Keycloak.
      POST /v1/orders ran 14 times: four 201, two 200 replays, one 400 validation,
      five 409 conflicts and two simulated lost-response 503s. There were zero
      401 responses. The reconnect scenario observed an actual empty-cart GET,
      a 409 COMMERCE_CART_EMPTY preview, one persisted group and a 200 replay
      with the original key/body. Fixed concurrent evidence appends in the mock
      before this final run so simultaneous refetches cannot erase request
      records. The 375px price-conflict screenshot was visually inspected:
      both amounts, detail, confirm action and return link remain readable.
      Logs and screenshots were copied to the task-local place-order-151
      artifact folder before further test runners could clean test-results.
    source: >-
      tests/place-order.spec.ts; tests/checkout.spec.ts;
      playwright.checkout.config.ts; postman/mocks/checkout-api/default.js;
      test-results/checkout-simulation.ndjson (ignored local final-run log,
      copied to the task-local place-order-151 artifact folder);
      place-order-price-conflict-mobile.png
    updated_at: "2026-11-04"
  - id: place-order-develop-cookie-integration-20261106
    status: supported
    claim: Address review and idempotent order creation remain compatible with the merged cookie session lifecycle in the modeled scenarios.
    reason: The existing frontend and shared HTTP boundary were exercised against repository-owned checkout and gateway stand-ins.
    verification: On 2026-11-06 all 24 checkout/place-order browser scenarios, 186 unit tests, lint, generated-type check and typecheck passed after merging develop and resolved #150. Live inventory, carrier and backend acceptance remain pending.
    source: tests/place-order.spec.ts; tests/checkout.spec.ts; postman/simulations/checkout.sim.yaml
    updated_at: "2026-11-06"
  - id: order-to-qr-stack-integration-20261106
    status: supported
    claim: The stacked checkout implementation opens real QR instructions for its created order group under the modeled dependencies.
    reason: Checkout payment initiation now resolves the group created by the same local stand-in, rather than ending at the earlier payment placeholder.
    verification: On 2026-11-06 all 10 selected place-order/409/retry/logout browser scenarios passed after combining #151 and #152. The double-click case displayed the created group reference on the QR payment page. Generated-type check, lint, typecheck and all 193 unit tests passed. These findings do not establish live backend or bank integration.
    source: tests/place-order.spec.ts; postman/mocks/checkout-api/default.js; features/CheckoutPaymentPage.tsx
    updated_at: "2026-11-06"
  - id: checkout-138-address-contract-20261111
    status: supported
    claim: >-
      The delivered #138 preview and order request use provinceCode and wardCode
      with recipient contact, addressLine and countryCode, rather than
      city/district/ward display names.
    reason: >-
      The merged Commerce ShippingAddress DTO and OpenAPI define these fields.
      This fixture now validates that request shape and keys simulated quote
      fees, delays and recorded completion evidence by wardCode. Its synthetic
      locality lists and fees remain independent of the live #201 API.
    verification: >-
      On 2026-11-11 inspected CreateOrderRequest.ShippingAddress and merged
      Commerce OpenAPI at the checkout-138-merge-adaptation fingerprint. Updated
      existing request/race assertions without removing scenarios. The parent then
      ran all 24 checkout/place-order browser scenarios successfully against
      these local HTTP stand-ins, including exact request bodies and wardCode
      quote races. This does not establish live GHN or carrier acceptance.
    source: >-
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/dto/request/CreateOrderRequest.java;
      ../be-project-nexus/docs/api/openapi/commerce-service.yaml;
      postman/mocks/checkout-api/default.js;
      tests/checkout.spec.ts; tests/place-order.spec.ts
    updated_at: "2026-11-11"
