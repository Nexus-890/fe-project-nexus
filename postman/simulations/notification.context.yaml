    date: "2026-11-05"
    commit: "13768ea3 merged with develop 0d0a36a4, before merge commit"
    cli: "Postman CLI 1.73.0; local notification simulation on port 3915"
  - id: notification-fix-local
    date: "2026-11-03"
    commit: "b7b2b945e03a73b63d021028df364df57b845be1 with uncommitted notification fix and simulation"
    cli: "Postman CLI 1.73.0; node v24.15.0"
