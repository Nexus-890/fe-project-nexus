purpose:
  stands_in_for: >-
    The buyer order-list, detail, history and cancellation HTTP endpoints using
    the delivered envelope, pagination and OrderResponse fields. The current
    worktree adds the server-computed canCancel contract. Auth and public catalog
    calls forward to the repository's existing OIDC and catalog fixtures. This is a local mock;
    published owner mocks were not searched because the installed CLI does
    not provide the skill's postman status command.
  unblocks: >-
    Focused browser verification of /orders, URL filters, paging, empty/error
    states, payment destination selection, detail lines/status/history, cancellation,
    refund progress and mobile layout without a live backend.
assumptions:
  - id: delivered-list-contract
    status: supported
    claim: >-
      The delivered buyer list is a protected GET with optional status and
      zero-based page/size inputs, a data array and sibling page metadata.
    reason: >-
      The OpenAPI, OrderController and OrderResponse inspected on develop
      describe the same list envelope and eight supported order statuses.
    verification: >-
      On 2026-11-04 inspected the source at fingerprint order-list-154.
      This records the source contract; a live service has not been exercised.
    source: >-
      ../be-project-nexus/docs/api/openapi/commerce-service.yaml;
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/controller/OrderController.java;
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/dto/response/OrderResponse.java
    updated_at: '2026-11-04'
  - id: pending-order-group-id
    status: unknown
    claim: The live order-list response supplies each pending order's orderGroupId.
    reason: >-
      Task #154 requires this field and explicitly permits a mock until #138
      merges. Develop's OrderResponse and delivered list schema omit it.
      The fixture adds it only to exercise the requested payment destination.
      This was the 2026-11-04 source state. At order-detail-history-cancel-20261112,
      develop now delivers orderGroupId in OrderResponse and OpenAPI; runtime
      availability remains unknown because no live backend was exercised.
    verification: >-
      On 2026-11-04 source inspection confirmed the missing field. Pending
      payment links require the compatible #138 backend contract before live use.
      On 2026-11-12 inspected the newer delivered source and confirmed the field
      is now present. The local browser uses distinct group and order IDs.
    source: >-
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/dto/response/OrderResponse.java;
      postman/mocks/order-list-api/default.js; task #154 acceptance criteria
    updated_at: '2026-11-12'
  - id: simulated-order-list-caller
    status: supported
    claim: >-
      The real frontend displays and filters the modeled order list, selects
      the pending order's group payment URL and stays usable at 375x812.
    reason: >-
      The actual Next.js application and browser HTTP boundary ran against
      the order fixture. Nine acceptance scenarios passed, and the simulation
      recorded the order requests and expected modeled response statuses.
    verification: >-
      On 2026-11-04 ran npm run test:browser -- --config playwright.orders.config.ts
      with fingerprint order-list-154: 9 tests passed in 29.9 seconds. Covered
      signed-out access, three populated rows, exact pending group payment
      destination, status persistence through refresh/re-sign-in, zero-based
      paging with the selected status, empty list, Problem Detail plus manual
      retry, missing group safety, and COMMERCE_UNAUTHENTICATED prompting
      sign-in. The long-number scenario checked document width and visible
      text clipping at 375x812 and 1024x812; only intentionally sr-only content
      was excluded. Inspected the desktop, mobile and long-number mobile
      screenshots visually. The final order-list-simulation.ndjson held
      20 order GET events: 15 HTTP 200, 2 HTTP 401 and 3 HTTP 503; these counts
      exclude OPTIONS. Logs confirmed page=1 for UI page 2 and status preserved
      in the query. The initial startup and a later rerun stopped at Next's
      existing security reminder; retrying the unchanged command continued.
      No live service behavior is inferred from this simulation.
    source: tests/orders.spec.ts; playwright.orders.config.ts; postman/mocks/order-list-api/default.js
    updated_at: '2026-11-04'
  - id: gateway-cookie-session-order-list
    status: supported
    claim: >-
      In the focused local scenarios, the real order-list frontend restores
      its gateway cookie session on reload and replays a protected 401 once
      after refreshing before showing the sign-in action.
    reason: >-
      The fixture forwards session bodies, origin/app headers and cookies to
      the existing gateway stand-in. Browser checks observed the restored
      filtered list and exactly two order reads plus one gateway refresh in
      the persistently unauthorized scenario.
    verification: >-
      On 2026-11-06 ran all nine focused browser scenarios with fingerprint
      order-list-154-develop-reconciliation: 9 passed in 39.2 seconds. The
      simulation log contains order endpoint request events with 200, 401
      and 503 responses, demonstrating caller execution against the stand-in.
      The mobile/desktop screenshots were visually inspected. The initial
      cross-volume dependency junction could not run Next; local dependency
      copies resolved it. Existing Next upgrade reminders required unchanged
      command retries. This does not establish live backend compatibility.
    source: tests/orders.spec.ts; playwright.orders.config.ts; postman/mocks/order-list-api/default.js
    updated_at: '2026-11-06'
  - id: stacked-confirmation-query-safety
    status: supported
    claim: >-
      The full account order list preserves confirmation parameters across
      filtering and reload without treating those URL flags as payment evidence.
    reason: >-
      The banner requires an all-PAID group read from the current session cache.
      The focused real-browser scenario carries a forged confirmation query
      through filtering and cookie restoration without displaying confirmation.
    verification: >-
      On 2026-11-06 all ten focused order browser scenarios passed in 39.7
      seconds on order-list-154-stacked. Group-service and list-service suites
      were retained; all 191 frontend unit tests passed. The local simulation
      recorded the list requests with successful and rejected responses.
    source: tests/orders.spec.ts; features/OrdersPage.tsx; features/useOrders.ts
    updated_at: '2026-11-06'
  - id: order-detail-cancellation-contract
    status: supported
    claim: >-
      The working-tree order DTO exposes canCancel as a snapshot of caller
      privilege, ownership/management role and order/group state. Pending
      cancellation affects an unpaid group; paid cancellation affects one order.
    reason: >-
      OrderService and the updated delivered OpenAPI agree on ORDER.CANCEL,
      buyer/Admin/Support access, PAID eligibility and PENDING eligibility only
      when the group is PENDING. Cancellation locks and rechecks state, so a
      previously eligible snapshot may still receive a 409.
    verification: >-
      On 2026-11-12 inspected OrderResponse, OrderService, OrderController and
      the working-tree OpenAPI at fingerprint order-detail-history-cancel-20261112.
      This records source behavior; it does not establish a deployed service.
    source: >-
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/dto/response/OrderResponse.java;
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/service/OrderService.java;
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/controller/OrderController.java;
      ../be-project-nexus/docs/api/openapi/commerce-service.yaml
    updated_at: '2026-11-12'
  - id: simulated-order-detail-caller
    status: supported
    claim: >-
      In the modeled scenarios, the real frontend opens order detail from the
      list, displays immutable lines/total/status/history, follows canCancel,
      handles cancellation and 403/409 messages, and refreshes refund progress.
    reason: >-
      The real Next.js app and shared HTTP client used the local Postman mock
      for the order endpoints. Browser assertions checked rendered results and
      recorded authenticated requests, including exactly one POST per cancellation.
    verification: >-
      On 2026-11-12 ran npm run test:browser -- --config playwright.orders.config.ts
      at fingerprint order-detail-history-cancel-20261112: all 27 tests passed in
      1.1 minutes (17 detail and 10 existing list cases). Covered list-to-detail
      navigation; private-read suppression while signed out; pending cancellation
      with trimmed reason and detail/history/list refresh; PAID cancellation
      followed by Awaiting refund, REFUND_REQUESTED and REFUNDED via explicit
      test-only state advancement and manual refresh; hidden actions for all
      terminal states and for false/missing canCancel; a stale eligibility 409
      preserving its message and refreshing the snapshot; a foreign-order 403
      without a history read or retry button; independent history and detail
      recovery; and desktop/mobile layout. The NDJSON contains 90 non-OPTIONS
      order requests: successful detail/history reads, two cancel POST 200s,
      one cancel POST 409, one detail 403, one history 503, and list/detail error
      reads. Desktop 1440px, mobile 375x812, refund and 403 captures were visually
      inspected with no clipping. Initial browser startup rejected a cross-volume
      node_modules junction; copying dependencies locally resolved it. An existing
      Next reminder stopped one startup; the unchanged final command continued.
      The earlier run had three unscoped alert-selector failures caused by Next's
      route announcer; scoping the assertions to main fixed the tests. After
      adding cart invalidation and removing a duplicated terminal-status badge,
      reran only pending and paid cancellation: 2 passed in 22.5 seconds. The
      pending case now observes a fresh cart GET after cancellation. A fixture
      evidence read/modify/write race initially lost a history record even though
      the NDJSON and rendered history showed both reads; serializing evidence
      writes fixed the fixture bookkeeping. The updated refund screenshot was
      visually inspected. No live
      service, real privilege enforcement, Kafka refund delivery, refund timing,
      multi-order group cancellation or production Keycloak behavior is inferred.
    source: >-
      tests/order-detail.spec.ts; tests/orders.spec.ts; playwright.orders.config.ts;
      postman/mocks/order-list-api/default.js; test-results/order-list-simulation.ndjson
    updated_at: '2026-11-12'
  - id: simulated-forbidden-request-lifecycle
    status: supported
    claim: >-
      In the repeated local Next development scenarios, a cancelled initial
      detail transport can reach the stand-in before the replayed mount request.
      The revised 403 check distinguishes this from an HTTP retry after 403.
    reason: >-
      The original assertion counted every request received by the stand-in as
      a completed request. Browser traces show an aborted initial request with
      no response followed by exactly one completed 403. Whether the cancelled
      attempt reaches the stand-in depends on timing. The test now requires
      exactly one completed 403, allows only explicitly observed ERR_ABORTED
      attempts before that response, rejects requests started after 403, and
      bounds the stand-in count by completed plus explicitly aborted attempts.
      All received requests must still match the authorized foreign-order GET,
      history must remain unread, and the visible error/navigation/overflow
      checks are preserved. Production HTTP and fixture behavior are unchanged.
    verification: >-
      On 2026-11-12 at fingerprint order-detail-browser-lifecycle-review,
      repeated the unchanged foreign-order browser test six times with tracing:
      four passed and two failed only its exact stand-in-count assertion, which
      observed two GETs instead of one. Both failures had one cancelled browser
      transport and one completed 403; the UI checks passed. After correcting
      the test, all ten repeated runs passed in 1.2 minutes. Every run's
      forbidden-request-outcomes attachment records one net::ERR_ABORTED attempt
      followed by one completed 403, with no request started after that response.
      In those ten runs the stand-in received only the completed request. This
      is the measured local failure, not a claim to reproduce the reviewer's
      separately reported failure frequency. A full-suite run also exposed the
      same initial cancellation in the detail-503/manual-retry test: the trace
      had an aborted transport, a completed 503 and a completed 200. That test
      now requires exactly one additional GET after its explicit Retry action,
      relative to the observed failed-read baseline; history remains unread
      until recovery. After both test corrections, the whole focused order
      suite passed all 27 cases in 1.2 minutes with tracing enabled, including
      the unchanged order-list 401 case. The repeated and final runs used
      isolated app/API/OIDC/order ports 3118/3921/3923/3924 and dist directory
      .next-orders-flake after pre-existing default-port fixture collisions.
      Existing Next security reminders interrupted some server startups; those
      connection-refused runs did not establish application behavior and the
      unchanged commands were retried. The unrelated existing order-list 401
      test was not changed or independently investigated here.
    source: >-
      tests/order-detail.spec.ts; playwright.orders.config.ts;
      postman/mocks/order-list-api/default.js;
      Playwright forbidden-request-outcomes attachment and trace.zip;
      test-results/order-list-simulation.ndjson
    updated_at: '2026-11-12'
