purpose:
  stands_in_for: >-
    Local auction-service HTTP dependencies, catalog media/detail, gateway cookie session
    and Keycloak protocol. The auction detail, numeric POST bid and own bid list use
    delivered DTOs. At merged develop aa238638, state and public history are also
    delivered; older assumptions below retain their dated pre-delivery evidence.
    The shared #220 room additionally reads protected seller reputation and shows
    returned score/trust alongside its bidding controls. SSE /stream with
    named state follows the 2026-11-14 reviewer clarification for #253; runtime delivery
    remains unverified. Winner shipping follows the exact controller/OpenAPI contract on
    unmerged #172 branch b17f3275. No published owner mock was identified: installed CLI
    1.73.0 has no postman status command, and postman mock list --json lists only local
    mocks with null IDs.
  unblocks: >-
    Real Next.js browser acceptance of the Auction room with state polling, server-derived
    countdown, idempotent bid retry, masked history, end states, SSE silence fallback,
    two-browser updates, conditional winner address review and payment handoff, and
    responsive layout, plus buyer auction discovery, My Bids, reviewer-agreed offer
    routes and accepted-offer address/payment handoff. The browser has no HTTP proxy setting, so dedicated one-port
    dependency routing uses 3928 and the app uses 3118.
assumptions:
