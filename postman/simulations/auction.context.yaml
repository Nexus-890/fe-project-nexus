purpose:
  stands_in_for: >-
    Local auction-service HTTP dependencies, catalog media/detail, gateway cookie session
    and Keycloak protocol. The auction detail, numeric POST bid and own bid list use
    delivered DTOs; state and public history use the #168/#169 draft. SSE /stream with
    named state follows the 2026-11-14 reviewer clarification for #253; runtime delivery
    remains unverified. Winner shipping follows the exact controller/OpenAPI contract on
    unmerged #172 branch b17f3275. No published owner mock was identified: installed CLI
    1.73.0 has no postman status command, and postman mock list --json lists only local
    mocks with null IDs.
  unblocks: >-
    Real Next.js browser acceptance of the Auction room with state polling, server-derived
    countdown, idempotent bid retry, masked history, end states, SSE silence fallback,
    two-browser updates, conditional winner address review and payment handoff, and
    responsive layout. The browser has no HTTP proxy setting, so dedicated one-port
    dependency routing uses 3928 and the app uses 3118.
assumptions:
  - id: draft-read-and-sse-delivery
    status: conflicting
    claim: >-
      The backend supplies GET auction state and public bid history, an SSE stream, and
      winner settlement/order fields for the complete room flow.
    reason: >-
      The supplied task requires these capabilities and draft auction OpenAPI documents
      state/history, but origin/develop 09b3cf6f controllers do not implement state,
      public history or SSE. AuctionResponse omits finalPrice, paymentDueAt and orderId. A
      local fixture cannot establish their delivery.
    verification: >-
      On 2026-11-13 compared delivered and draft OpenAPI and auction/bid controllers.
      Rechecked on 2026-11-14: develop remains 09b3cf6f. #172 branch b17f3275 now
      implements shipping confirmation but AuctionResponse still omits
      orderId/finalPrice/paymentDueAt, and OrderResponse exposes no auction reference.
      Reviewer selected /stream and named state for #253; no backend implementation was
      found in inspected refs. Local fixture behavior does not settle these runtime
      dependencies.
    source: >-
      ../be-project-nexus/docs/api/auction-service.yaml;
      ../be-project-nexus/docs/api/openapi/auction-service.yaml;
      ../be-project-nexus/auction-service/src/main/java/com/group5/auctionservice/auction/AuctionController.java;
      postman/mocks/auction-api/default.js; tests/auction.spec.ts
    updated_at: '2026-11-14'
  - id: auction-browser-behavior
    status: supported
    claim: >-
      The prior frontend revision aebc78e3 passed fourteen local Auction scenarios:
      two-second public updates, server-clock countdown, authenticated numeric bidding,
      server minimum correction, safe same-key replay, winner order link, draft-read
      failure feedback, SSE disconnect fallback, mobile bounds, zero-countdown closure
      with late extension reopening, stale-history leading protection, 429 recovery, SSE
      burst coalescing and unsafe-money validation.
    reason: >-
      The suite runs Next and its actual API boundary against Postman HTTP dependency
      servers. This is retained historical evidence for the initial room, not validation
      of the changed stream protocol, settlement UI or winner shipping flow. Assertions
      inspect UI and fixture request/write evidence; they do not establish real backend
      delivery.
    verification: >-
      On 2026-11-13 ran npm run test:browser -- --config playwright.auction.config.ts:
      fourteen passed in 1.1 minutes after an unchanged retry when the Next security
      reminder stopped the first startup. The run covered successful, deliberate
      404/429/503 and terminal responses, 30-event SSE burst coalescing, one safe same-key
      replay write, and no unmodeled 501 calls. Inspected and preserved desktop, mobile,
      leading and winner PNGs in docs/features/auction-evidence/; mobile controls remain
      within 375px and the leading button hover keeps readable contrast. Initial attempts
      before the final unchanged retry stopped on the cross-drive dependency junction or
      security reminder; copying installed dependencies into this worktree resolved the
      environment issue. No production bundler or backend source was changed. Ports
      3118/3928 stopped after runner cleanup. On 2026-11-14 reviewer fixes superseded this
      behavior; expanded suite results must be recorded separately before claiming current
      browser coverage.
    source: >-
      tests/auction.spec.ts; playwright.auction.config.ts; tests/auction-fixture.mjs;
      postman/mocks/auction-api/default.js; test-results/auction-simulation.ndjson
      (ignored local evidence); test-results/auction/ (ignored local traces);
      docs/features/auction-evidence/{desktop,leading,mobile,won}.png
    updated_at: '2026-11-14'
  - id: reviewer-stream-and-terminal-behavior
    status: supported
    claim: >-
      Against the local HTTP fixtures, the revised room applies matching named state
      immediately, restores polling after silence, rejects stale snapshots and waits for
      final settlement before a verified winner/loser result.
    reason: >-
      Historical checkpoint at 6550d254 only. Its five-second state-only liveness rule and
      public optional checkout references were superseded by the latest
      heartbeat/private-projection revision.
    verification: >-
      On 2026-11-14 the complete auction browser suite passed 25/25 in 2.1 minutes;
      unit/auth/service tests passed 283. Two independent contexts measured 78.5974ms from
      bid click to observer update. After 5.6 seconds of stream silence two fallback polls
      occurred. Invalid/foreign state, delayed loss and stale private win cases passed.
      Evidence counts 1192 HTTP calls: API 1044, Keycloak 102, session 46, no unmodeled
      501, ten /stream 200 and 26 deliberate /stream 503 responses, no /events. Live #267
      T4 and 1000 connections remain unverified. The earlier address-preservation failure
      was fixed before this final full run; initial Next security reminders interrupted
      startup and unchanged retries succeeded. Final generated-type drift, lint and fresh
      typecheck pass. The isolated production build at .next-auction-review-build passed
      after an unchanged security-advisory retry. Full catalog passed 55 with 38 existing
      configuration skips and zero failures in 2.2 minutes after an unchanged
      advisory/startup-shutdown retry. No production changes followed the 25-browser run.
    source: >-
      features/useAuctionState.ts; features/auctionStateReconciliation.ts;
      tests/auction-state-reconciliation.test.ts; tests/auction.spec.ts;
      docs/features/auction-verification.md;
      docs/features/auction-evidence/two-context-push-timing.json;
      test-results/auction-simulation.ndjson (ignored local HTTP evidence)
    updated_at: '2026-11-14'
  - id: winner-shipping-contract-and-replay
    status: supported
    claim: >-
      On #172 branch b17f3275, shipping confirmation accepts a direct ShippingAddress body
      and returns group id, numeric shipping/total and the original deadline; an identical
      normalized address replays its saved confirmation.
    reason: >-
      The integration branch controller, service and OpenAPI agree on this contract. It is
      not merged into develop and has not been exercised here against a real service. The
      room requires a genuine order id that current read DTOs do not expose, so complete
      live winner checkout remains open. The latest revision now supplies the missing
      owner-only order reference through the existing /bids/mine backend read; current
      integration tests prove recorded-value privacy with real PostgreSQL, while
      settlement workers remain an integration dependency.
    verification: >-
      On 2026-11-14 inspected b17f3275 AuctionShippingController, AuctionShippingService
      and commerce OpenAPI. Four service tests cover direct HTTP serialization/current
      Bearer, numeric validation, preflight address validation and preserved 409/abort
      outcomes; the 283-unit run passed. The final 25/25 browser run also passed address
      review before POST, identical-address recovery with one fixture confirmation,
      typed-input preservation through WON-to-SETTLED and private 503, and private timeout
      CTA closure. Navigation loaded the existing payment page and its fixture QR. This
      proves caller handoff against stand-ins, not a real payment session, transfer or
      delivered order-reference read API.
    source: >-
      b17f3275:be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/AuctionShippingController.java;
      b17f3275:be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/AuctionShippingService.java;
      b17f3275:be-project-nexus/docs/api/openapi/commerce-service.yaml;
      service/auctionCheckoutService.ts; tests/auction-checkout-service.test.ts;
      features/AuctionWinnerCheckout.tsx; tests/auction.spec.ts
    updated_at: '2026-11-14'
  - id: heartbeat-and-private-winner-projection-20261114
    status: supported
    claim: >-
      Named heartbeat every 15 seconds keeps the stream healthy; 30 seconds of silence
      restores polling. The existing private own-bids API exposes only the recorded
      winner's stored orderId/paymentDueAt/finalPrice, and the room consumes this private
      handoff.
    reason: >-
      The real PostgreSQL/JWT-scoped MVC read and its privacy boundary passed integration
      tests. The real Next frontend passed HTTP stand-in tests using opaque named
      heartbeats, delayed private order projection, address confirmation and the payment
      page. These results do not establish STAGING, Kafka settlement, bank integration or
      load acceptance.
    verification: >-
      2026-11-14: 289 FE unit tests and 26/26 auction browser scenarios passed (3.2
      minutes). Actual per-connection heartbeat spacing 15012ms during a 32041ms
      observation; silence exceeded 30s before two-second fallback. Local two-context
      update 116.6478ms. HTTP log: 1233 requests (API1083, Keycloak103, session47), zero
      unmodeled501 and zero /events. Backend selected verify passed268Surefire+10Failsafe
      with two Docker-only fixtures excluded; focused MyBid integration23passed on
      disposable PostgreSQL18.6. OpenAPI lint/inventory100 passed. Final FE
      lint/typecheck/generated drift passed; production build at
      .next-auction-heartbeat-build passed after unchanged security-reminder retry; full
      catalog passed55 with38existing configuration skips, zero failures,2.8minutes after
      unchanged security-reminder retry.
    source: >-
      features/useAuctionState.ts; service/auctionService.ts; tests/auction.spec.ts;
      docs/features/auction-evidence/heartbeat-contract-timing.json;
      docs/features/auction-evidence/two-context-push-timing.json;
      ../be-project-nexus/auction-service/src/main/java/com/group5/auctionservice/bidding/MyBidQuery.java;
      ../be-project-nexus/docs/testing/auction-mine.md
    updated_at: '2026-11-14'
