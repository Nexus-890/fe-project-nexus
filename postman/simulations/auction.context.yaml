    status: conflicting
    claim: >-
      The backend supplies GET auction state and public bid history, an SSE stream, and
      winner settlement/order fields for the complete room flow.
    reason: >-
      The supplied task requires these capabilities and draft auction OpenAPI documents
      state/history, but origin/develop 09b3cf6f controllers do not implement state,
      public history or SSE. AuctionResponse omits finalPrice, paymentDueAt and orderId. A
      local fixture cannot establish their delivery.
    verification: >-
      On 2026-11-13 compared delivered and draft OpenAPI and auction/bid controllers.
      Rechecked on 2026-11-14: develop remains 09b3cf6f. #172 branch b17f3275 now
      implements shipping confirmation but AuctionResponse still omits
      orderId/finalPrice/paymentDueAt, and OrderResponse exposes no auction reference.
      Reviewer selected /stream and named state for #253; no backend implementation was
      found in inspected refs. Local fixture behavior does not settle these runtime
      dependencies.
    source: >-
      ../be-project-nexus/docs/api/auction-service.yaml;
      ../be-project-nexus/docs/api/openapi/auction-service.yaml;
      ../be-project-nexus/auction-service/src/main/java/com/group5/auctionservice/auction/AuctionController.java;
