purpose:
  stands_in_for: >-
    The repository's user-service profile endpoints, shared shop shell and Keycloak
    redirect/callback dependencies. The API fixture is derived from committed backend controllers,
    ApiResponse and DTOs; the reused local oidc-keycloak member derives from the committed
    realm/protocol fixture. No published mock is used.
  unblocks: >-
    Browser validation of the real frontend's profile read/update flow using a local Postman HTTP
    stand-in with stateful saves and injected failures.
assumptions:
  - id: delivered-profile-contract
    status: supported
    claim: >-
      The delivered profile GET and PUT return UserResponse inside the shared code/message/data
      envelope; UpdateProfileRequest omits phone.
    reason: >-
      The backend UserController, ApiResponse and generated request/response DTOs define this
      contract. Frontend accountService validates the nested user. The injected phone validation
      error exercises UI field-error placement, rather than claiming the current backend supports
      phone updates.
    verification: >-
      On 2026-11-04 inspected the origin/develop user-service contract at the develop-merge
      fingerprint and migrated all success fixtures to envelopes, with field/code/detail validation
      errors. The browser assertions verify readonly phone is omitted from the changed-fields-only
      PUT body. On 2026-11-05 inspected the same envelope/field shapes after merging origin/develop
      at the shared-cart-develop-merge fingerprint; the API fixture retains them while replacing
      credential login with OIDC.
    source: >-
      ../be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/UserController.java;
      ../be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/dto/UpdateProfileRequest.java;
      ../be-project-nexus/lib/common-core/src/main/java/com/group5/common_core/model/ApiResponse.java;
      service/accountService.ts; tests/profile.spec.ts; postman/mocks/profile-gateway/default.js
    updated_at: '2026-11-05'
  - id: frontend-profile-against-http-fixture
    status: supported
    claim: >-
      In the nine local scenarios, profile reads, changed-field updates, shared header data, error
      feedback and session cleanup behave as asserted.
    reason: >-
      Playwright runs the real Next.js app through its shared API transport. The fixture checks the
      issued local Bearer token, persists profile edits and controls response timing/status; it does
      not run the real backend.
    verification: >-
      On 2026-11-04 npm run test:profile passed all 9 scenarios in 35.9 seconds at the develop-merge
      fingerprint. Covered anonymous redirect, profile entry GET, exact changed PUT fields, header
      update, cancel, client validation, field errors, delayed loading skeleton, expired-session
      PUT, GET/PUT retries and mobile/desktop screenshots with no clipped text. Log inspection
      confirmed GET profile 200 (23) and 503 (2), PUT profile 200 (2), 400 (1), 401 (1) and 503 (1).
      Both ports stopped and tsconfig was restored by the runner. Initial Next startup stopped for
      the existing advisory reminder; an unchanged retry produced the passing run. This is
      historical pre-OIDC profile-suite evidence. The 2026-11-05 redirect/callback migration
      requires its own browser run below before claiming the updated flow passes. On 2026-11-05, at
      the shared-cart-develop-merge fingerprint, npm run test:profile passed all 9 scenarios in 38.0
      seconds through the OIDC redirect/callback. Log inspection confirmed one listening event, GET
      profile 200 (23)/503 (2), PUT profile 200 (2)/400 (1)/401 (1)/503 (1), and eight Keycloak
      token POST 200 responses. This verifies the migrated caller against its HTTP stand-ins,
      including expired-save local cleanup; it does not revalidate the dated live-backend evidence.
    source: >-
      tests/profile.spec.ts; playwright.profile.config.ts; postman/mocks/profile-gateway/default.js;
      profile-simulation.ndjson (generated, ignored); test-results/profile (ignored)
    updated_at: '2026-11-05'
  - id: oidc-profile-fixture-wiring
    status: supported
    claim: >-
      The current local profile suite is configured to exercise Keycloak's redirect/callback flow
      and accepts only the issued stand-in Bearer for profile/cart requests, rather than
      substituting a password-login route.
    reason: >-
      The profile simulation reuses the oidc-keycloak member and its shared access-token hash;
      profile-gateway compares the request token hash before serving private data. Test setup resets
      both members between scenarios.
    verification: >-
      On 2026-11-05 inspected profile.sim.yaml, profile-gateway/default.js,
      playwright.profile.config.ts and tests/profile.spec.ts at the shared-cart-develop-merge
      fingerprint. The app uses port 3103 and both simulation members route through port 3913. npm
      run test:profile then passed 9/9 in 38.0 seconds; eight successful provider
      authorization/token exchanges preceded authenticated API calls. A PUT 401 returned to local
      sign-in without a remote logout request in the simulation log. On 2026-11-05, at the
      shared-cart-guest-reconciliation fingerprint, npm run test:profile passed 9/9 in 42.5 seconds
      with CartProvider mounted. Its log contains one listening event, profile GET 200 (23)/503 (2),
      profile PUT 200 (2)/400 (1)/401 (1)/503 (1), and eight successful OIDC token exchanges. These
      are local fixture results; no backend was started.

      On 2026-11-05, the shared-cart-session-reconciliation run passed all nine profile cases in
      42.6 seconds at isolated ports 3143/3954. Profile GET 200 (23)/503 (2)/401 (1), PUT 200
      (2)/400 (1)/401 (2)/503 (1), and nine token exchanges were observed. The persistent save-time
      401 now traverses shared token renewal and one replay before local auth cleanup. Port
      substitutions were restored; this remains local fixture evidence.
    source: >-
      tests/profile.spec.ts; playwright.profile.config.ts; postman/simulations/profile.sim.yaml;
      postman/mocks/profile-gateway/default.js; postman/mocks/oidc-keycloak/default.js
    updated_at: '2026-11-05'
  - id: live-profile-backend
    status: unknown
    claim: >-
      The running gateway/user service accepts the frontend session and persists profile edits under
      actual authentication and permissions.
    reason: The local run substitutes HTTP dependencies and does not start the backend.
    verification: >-
      No live-backend request was made for this migration. A signed-in profile read/update against
      the deployed gateway is still needed.
    source: service/accountService.ts; playwright.profile.config.ts
    updated_at: '2026-11-04'
  - id: auth-profile-success-envelope
    status: supported
    claim: >-
      The backend contract at develop-contract-20261103 wraps successful login,
      registration, and GET/PUT users/me DTOs in code, message, and data properties.
    reason: >-
      The controllers explicitly return ApiResponse.of, and ApiResponse defines
      code 0 and message response success as defaults while retaining the DTO in data.
    verification: >-
      On 2026-11-03, read the backend source at origin/develop 6e92bbac using
      git show. This establishes the source contract only. No live backend
      requests were made. The local mock and auth stub were updated to model it.
    source: >-
      origin/develop:be-project-nexus/lib/common-core/src/main/java/com/group5/common_core/model/ApiResponse.java:7-25;
      origin/develop:be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/AuthController.java:27-37;
      origin/develop:be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/UserController.java:31-39;
      postman/mocks/profile-gateway/default.js; tests/fixtures/auth-stub.ts
    updated_at: "2026-11-03"
  - id: validation-error-wire-shape
    status: supported
    claim: >-
      The backend validation contract at develop-contract-20261103 returns
      application/problem+json with errors entries containing field, code, and detail.
    reason: >-
      GlobalExceptionHandler constructs ValidationError records with these three
      fields and sends ProblemDetail without the success envelope.
    verification: >-
      On 2026-11-03, read GlobalExceptionHandler at origin/develop 6e92bbac.
      No live backend error response was requested. The local fixture now uses
      the same wire field names; fixture codes are representative test values.
    source: >-
      origin/develop:be-project-nexus/lib/common-web/src/main/java/com/group5/common_web/exception/GlobalExceptionHandler.java:57-74,120-139;
      postman/mocks/profile-gateway/default.js; tests/fixtures/auth-stub.ts
    updated_at: "2026-11-03"
  - id: caller-handles-current-contract
    status: supported
    claim: >-
      The real Next.js frontend can sign in, populate the profile form, save a
      changed name, update the shared header, and render field errors using the
      current auth and profile wire contract in this simulation.
    reason: >-
      The real frontend passed all nine profile browser scenarios against the
      updated local simulation. The success path asserts envelopes on the wire,
      form and header values after saves, and field-error placement for detail.
      Support is limited to the scenarios run against these local fixtures.
    verification: >-
      On 2026-11-03 at fixture-edit-20261103, npm run test:profile passed 9/9
      browser tests and npm run test:auth passed 41/41 tests. Inspection of
      profile-simulation.ndjson confirmed eight POST login 200, 23 GET me 200,
      two PUT me 200, one PUT 400, one PUT 401, one PUT 503 and two GET 503
      events. No live backend runtime behavior is established by this run.
      On 2026-11-05 at profile-merge-20261105, npm run test:profile passed 9/9
      browser tests after the flat architecture and OIDC migration. The simulation
      log recorded eight provider token exchanges (200), 23 GET me (200), two
      GET me (503), two PUT me (200), and one each PUT 400, 401 and 503. No
      POST API password login occurred. This re-establishes the UI behavior
      against the new fixtures only; live backend verification remains pending.
      On 2026-11-05 at profile-guest-cart-conflict-resolution, all nine profile
      scenarios passed after merging develop ff2a4986. The inspected simulation
      log contained 23 successful GET me responses, two GET 503 responses,
      two successful PUT me responses and one each PUT 400, 401 and 503.
      The run used temporary isolated app/API ports 13103/13913; fixture and
      test port edits were restored afterwards. This is local fixture evidence.
      On 2026-11-05 at profile-session-develop-merge, the profile browser suite
      passed 10/10 in 39.0 seconds on temporary app/API ports 3153/3963, restored
      after the run. It adds proactive 120-second renewal coverage: dirty fields
      survive without another profile read and save through the renewed token.
      Persistent PUT 401 produces two PUTs, one renewal, no saved changes and
      no remote logout. The controlled clock is resumed before saving so queued
      TanStack state notifications can run; an earlier paused-clock attempt
      had returned correct PUT 200 data but held the UI notification. Before
      the next general runner cleaned the ignored output, log inspection found
      one listening event and 191 requests: token POST 200 (11), profile GET
      200 (26)/401 (1)/503 (2), PUT 200 (3)/400 (1)/401 (2)/503 (1).
    source: >-
      tests/profile.spec.ts; playwright.profile.config.ts;
      postman/simulations/profile.sim.yaml; postman/mocks/profile-gateway/default.js
    updated_at: "2026-11-05"
  - id: profile-phone-error-is-synthetic
    status: supported
    claim: >-
      The injected phone validation response tests field-error placement only;
      the backend update DTO at develop-contract-20261103 does not accept phone updates.
    reason: >-
      UpdateProfileRequest declares only fullName, dateOfBirth, gender, address,
      and email, and ignores unknown fields. The mock's putStatus 400 control
      deliberately supplies a phone error independently of submitted fields.
    verification: >-
      On 2026-11-03, inspected UpdateProfileRequest at origin/develop 6e92bbac
      and the local profile-gateway handler. This is source evidence; it does not
      demonstrate that a real backend rejects a profile update because of phone.
    source: >-
      origin/develop:be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/dto/UpdateProfileRequest.java:12-33;
      postman/mocks/profile-gateway/default.js; tests/browser/profile.spec.ts
    updated_at: "2026-11-03"
  - id: oidc-profile-integration
    status: supported
    claim: >-
      In the local browser scenarios, the application signs in through the
      Keycloak code and PKCE flow and sends the resulting Bearer token to GET/PUT
      users/me; the profile API fixture validates the issued token hash.
    reason: >-
      The profile simulation reuses the existing oidc-keycloak member rather than
      restoring the obsolete API password login. Both mocks share namespaced
      simulation state for token verification. The source backend controller
      still returns ApiResponse for GET and PUT users/me and its UpdateProfile
      DTO retains the five supported editable fields.
    verification: >-
      On 2026-11-05 at profile-merge-20261105, read UserController and
      UpdateProfileRequest from the incoming develop tree, then ran all nine
      profile browser scenarios against the real Next application. Request
      history and the simulation log confirm code exchanges and authenticated
      profile loads/saves, including recoverable failures and 401 expiry. This
      is local protocol evidence, not real Keycloak or backend runtime evidence.
    source: >-
      tests/profile.spec.ts; playwright.profile.config.ts;
      postman/mocks/profile-gateway/default.js; postman/mocks/oidc-keycloak/default.js;
      ../be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/UserController.java;
      ../be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/dto/UpdateProfileRequest.java
    updated_at: "2026-11-05"
  - id: profile-session-renewal-boundary
    status: supported
    claim: >-
      The profile workflow uses the shared token coordinator and originating
      auth generation for saves, so normal token rotation preserves its cache
      while an ended session cancels registered updates and rejects late results.
    reason: >-
      The merged Provider uses scoped request-context accessors, guarded generic
      profile mutations and an AbortController registry. The common HTTP boundary
      owns renewal and one protected-request replay; accountService does not
      introduce a separate token or session store.
    verification: >-
      On 2026-11-05 inspected the profile/session merge at the
      profile-session-develop-merge fingerprint, including Provider, tokenSession,
      configs/api.ts and the existing session-restore documentation. This is a
      source-level ownership/lifecycle finding. The exported source baseline
      passed 99/99 unit tests; the merged suite passed 138/138, generated DTO
      drift and fresh-route typecheck passed. The profile page now revalidates
      on session readiness rather than each token replacement; its fixture
      validates actual token expiry with the shared controlled clock. The current
      profile run passed 10/10 and the dedicated OIDC/guest/session run passed
      24/24; the main browser run passed 31/31. Lint, generated DTO drift,
      fresh-route typecheck and the isolated production build passed. The
      build generated all 13 pages, including the silent callback and excluding
      temporary probe routes. Their evidence is recorded separately from
      historical profile passes; no live backend/session restoration result
      is implied.
    source: >-
      providers/Provider.tsx; features/tokenSession.ts; configs/api.ts;
      service/accountService.ts; docs/features/session-restore.md;
      tests/profile.spec.ts; tests/session.spec.ts; tests/token-retry.test.ts
    updated_at: "2026-11-05"
  - id: merged-profile-fixture-expiry-model
    status: supported
    claim: >-
      The reconciled profile HTTP stand-in checks both the issued token hash and token expiry
      against the Keycloak fixture clock before serving private profile or cart data.
    reason: >-
      The incoming fixture adds expiry and controlled-clock checks while the cart branch supplies
      the shared Problem Details code/type defaults. Both describe the local dependency model;
      they do not establish live backend acceptance or caller behavior after this merge.
    verification: >-
      On 2026-11-05 at cart-profile-develop-reconciliation, compared both profile gateway handlers
      and the committed GlobalExceptionHandler. Retained the incoming expiry checks and test user
      inspection route, the branch's error metadata, and both histories above. No browser scenario
      was run during this source-only reconciliation; runtime evidence is recorded separately below.
    source: >-
      postman/mocks/profile-gateway/default.js; postman/mocks/oidc-keycloak/default.js;
      ../be-project-nexus/lib/common-web/src/main/java/com/group5/common_web/exception/GlobalExceptionHandler.java
    updated_at: '2026-11-05'
  - id: merged-cart-profile-browser-flow
    status: supported
    claim: >-
      The merged cart/profile frontend retains dirty profile fields during token renewal and
      clears local authentication after one renewal and one replay of a persistent save-time 401
      in the ten local profile browser scenarios exercised.
    reason: >-
      The real Next.js caller passed the profile suite against the shared local Keycloak and
      profile gateway stand-ins. UI assertions and observed HTTP calls establish these caller
      outcomes under the fixture contract only.
    verification: >-
      On 2026-11-05 at cart-profile-develop-reconciliation, npm run test:profile passed 10/10 in
      38.2 seconds. The profile log contained one listening event and 190 requests: profile GET
      200 (26)/401 (1)/503 (2), PUT 200 (3)/400 (1)/401 (2)/503 (1), cart GET 200 (9), and token
      POST 200 (11). The renewal scenario retained dirty fields and saved with the renewed token;
      persistent PUT 401 retried once and cleared local state without remote logout. Generated DTO
      drift, lint and fresh-route typecheck passed; unit tests passed 152/152 versus the 147-test
      branch baseline. No live backend or Keycloak runtime was exercised.
    source: >-
      tests/profile.spec.ts; playwright.profile.config.ts; providers/Provider.tsx;
      test-results/profile-simulation.ndjson (generated, ignored); tests/profile-fixture.mjs
    updated_at: '2026-11-05'
