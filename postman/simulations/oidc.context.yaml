  - id: backend-keycloak-token-support
    status: unknown
    claim: >-
      The current committed backend accepts Keycloak tokens and provisions new registrations in
      Keycloak.
    reason: >-
      Incoming origin/develop 59631cd6 configures gateway and user-service trust against Keycloak
      and implements registration through its admin client. This source migration supersedes the
      6e92bbac contradiction, but no backend runtime test or live Keycloak integration was run
      during this merge verification. The browser API fixture establishes frontend behavior against
      its model, not live backend token acceptance or registration provisioning.
    verification: >-
      On 2026-11-03 inspected the committed gateway/user-service configurations and registration
      service at 6e92bbac: both still trusted user-service issuer/JWKS and registration stored a
      local password without calling Keycloak. The realm README then assigned those migrations to
      issues 237 and 238. On 2026-11-04 inspected incoming origin/develop 59631cd6: gateway and
      user-service now configure Keycloak issuer/JWKS; user-service configures the Keycloak admin
      client; registration creates the Keycloak user, assigns its realm role and stores the profile,
      with deletion compensation if role assignment or profile persistence fails. The historical
      contradiction no longer describes this source. Real token acceptance and registration against
      running backend/Keycloak services remain unverified; live integration is required to settle
      the claim.
    source: >-
