  - id: real-keycloak-rp-logout
    status: unknown
    claim: >-
      The deployed realm accepts the application's ID-token-hinted logout with the current origin as
      post_logout_redirect_uri and ends the SSO session.
    reason: >-
      The local provider fixture models this behavior. Keycloak 26.7.5 source falls back to the
      client's allowed redirectUris when no explicit post.logout.redirect.uris is configured,
      covering localhost:3000 here. No real provider is running, so deployed realm/session behavior
      remains unverified.
    verification: >-
      On 2026-11-03 inspected the realm and the upstream 26.7.5
      OIDCAdvancedConfigWrapper.getPostLogoutRedirectUris fallback and LogoutEndpoint redirect
      validation. Real discovery was unreachable. Simulated browser logout establishes caller
      behavior only.
