purpose:
  stands_in_for: >-
    Local Keycloak OIDC endpoints and the profile/registration API, derived from
    infra/local-dev/keycloak/realm-nexus.json, service/authService.ts and UserResponse. The CLI is
    signed out, so published owner mocks were not searched or pulled.
  unblocks: >-
    Real browser verification of the Next.js sign-in callback, PKCE exchange, in-memory
    authentication, logout, and unchanged registration while Docker and the real services are
    unavailable. Uses one-port routing because browser fetch and navigation are configured with
    explicit local dependency origins. Also exercises guest-cart persistence and callback merge
    against the explicitly proposed guest contract recorded in docs/features/guest-cart.md. Session
    restoration and renewal scenarios reuse these stand-ins with the gateway's HttpOnly session
    cookie, rotating refresh grants and controlled failure/expiry conditions. These do not
    establish deployed backend readiness.
assumptions:
  - id: keycloak-code-pkce-contract
    status: supported
    claim: >-
      The committed nexus-web realm client is public, enables Authorization Code, requires PKCE S256
      and emits the claims expected by the project.
    reason: >-
      The realm configuration and its README define these settings. The local provider fixture
      additionally checks verifier/challenge binding and one-use authorization codes; this does not
      validate a running Keycloak.
    verification: >-
      On 2026-11-03 inspected the realm client, protocol mappers and README on origin/develop at
      6e92bbac. Browser fixture verification is recorded in the simulated-browser-flow claim below.
      Live Keycloak discovery refused connection and Docker Desktop's daemon was unavailable.
    source: >-
      ../be-project-nexus/infra/local-dev/keycloak/realm-nexus.json;
      ../be-project-nexus/infra/local-dev/keycloak/README.md;
      postman/mocks/oidc-keycloak/default.js; tests/oidc.spec.ts
    updated_at: '2026-11-03'
  - id: simulated-browser-flow
    status: supported
    claim: >-
      In the eleven local browser scenarios, the real Next.js client uses code exchange with PKCE,
      restores safe return destinations, sends the issued access token to the API and clears local
      authentication on logout.
    reason: >-
      Playwright runs the actual application and browser networking against the two local dependency
      fixtures. The provider validates the PKCE verifier against the authorization challenge; the
      API compares the Bearer token hash with the access token actually issued. These are caller
      integration checks under the fixture contract, not live provider proof. The 2026-11-04 run
      uses the backend success envelope instead of the raw user bodies used in the historical
      2026-11-03 run. The 2026-11-05 merge run preserves those eleven OIDC cases alongside six
      guest-cart cases using the same HTTP dependency stand-ins.
    verification: >-
      On 2026-11-03 ran npx playwright test --config playwright.auth.config.ts against the dirty
      frontend implementation fingerprint: 9 tests passed in 24 seconds. Covered normal
      sign-in/returnTo/logout/reload, tampered state, denied authorization, rejected token exchange,
      unsolicited callback, external returnTo, profile 503 then retry with exactly one code
      exchange, profile 401 clearing local state without provider logout, and registration remaining
      POST /api/v1/auth/register followed by sign-in. Browser storage had no access/ID tokens; the
      sign-in request path never posted passwords to our API. Inspected
      test-results/oidc-simulation.ndjson and observed metadata, provider
      authorization/token/logout, Bearer profile and registration requests with expected
      success/error responses. Ports 3103 and 3913 were no longer listening after Playwright
      cleanup. A prior attempt stopped because Next.js displayed its package security update
      reminder; retry ran the unchanged application successfully. On 2026-11-04 ran npm run
      test:auth:browser against the dirty oidc-envelope-merge fingerprint: all 11 scenarios passed
      in 29.4 seconds. The browser explicitly received GET /api/v1/users/me HTTP 200 and POST
      /api/v1/auth/register HTTP 201 with {code:0,message:"response success",data:user}. Sign-in
      returned to its requested page and registration navigated to sign-in. Missing envelope data
      and malformed user roles each produced the callback error, then succeeded on manual profile
      retry with exactly one code exchange. Inspected 137 simulation request events, including
      profile responses 200 (7), 401 (1) and 503 (1), registration 201 (1), token responses 200 (6)
      and 400 (1), and logout 302 (1). Ports 3103 and 3913 stopped after cleanup and tsconfig.json
      was restored. The first attempt stopped for the existing Next.js advisory reminder; an
      unchanged retry produced the passing run. Postman CLI 1.73.0 rejects postman status as an
      unknown command; its local simulation command ran successfully. On 2026-11-05, at the dirty
      guest-cart-develop-merge fingerprint, the final npm run test:auth:browser passed all 17
      scenarios in 41.5 seconds: 11 OIDC and 6 guest cases. An earlier attempt overlapped live
      source Hot Refresh; the stable final implementation passed on rerun. The existing Next.js 16.4
      security reminder also required unchanged startup retries. The final auth simulation log
      contained 236 request events; it was inspected before the subsequent general browser runner
      cleaned the ignored log. No detailed per-endpoint event counts were recorded for this run.
      This establishes caller behavior against the stand-ins, not live Keycloak or backend
      integration.

