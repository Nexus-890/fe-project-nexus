purpose:
  stands_in_for: >-
    Local Keycloak OIDC endpoints and the profile/registration API, derived from
    infra/local-dev/keycloak/realm-nexus.json, the backend user-service controllers
    and ApiResponse/UserResponse contract. Frontend callers use service/authService.ts.
    The CLI is signed out, so published owner mocks were not searched or pulled.
  unblocks: >-
    Real browser verification of the Next.js sign-in callback, PKCE exchange,
    in-memory authentication, logout, and unchanged registration while Docker
    and the real services are unavailable. Uses one-port routing because browser
    fetch and navigation are configured with explicit local dependency origins.
assumptions:
  - id: keycloak-code-pkce-contract
    status: supported
    claim: >-
      The committed nexus-web realm client is public, enables Authorization Code,
      requires PKCE S256 and emits the claims expected by the project.
    reason: >-
      The realm configuration and its README define these settings. The local
      provider fixture additionally checks verifier/challenge binding and
      one-use authorization codes; this does not validate a running Keycloak.
    verification: >-
      On 2026-11-03 inspected the realm client, protocol mappers and README on
      origin/develop at 6e92bbac. Browser fixture verification is recorded in the
      simulated-browser-flow claim below. Live Keycloak discovery refused connection and
      Docker Desktop's daemon was unavailable.
    source: >-
      ../be-project-nexus/infra/local-dev/keycloak/realm-nexus.json;
      ../be-project-nexus/infra/local-dev/keycloak/README.md;
      postman/mocks/oidc-keycloak/default.js; tests/oidc.spec.ts
    updated_at: "2026-11-03"
  - id: simulated-browser-flow
    status: supported
    claim: >-
      In the eleven local browser scenarios, the real Next.js client uses code
      exchange with PKCE, restores safe return destinations, sends the issued
      access token to the API and clears local authentication on logout.
    reason: >-
      Playwright runs the actual application and browser networking against
      the two local dependency fixtures. The provider validates the PKCE
      verifier against the authorization challenge; the API compares the Bearer
      token hash with the access token actually issued. These are caller
      integration checks under the fixture contract, not live provider proof.
      The 2026-11-04 run uses the backend success envelope instead of the raw
      user bodies used in the historical 2026-11-03 run.
    verification: >-
      On 2026-11-03 ran npx playwright test --config playwright.auth.config.ts
      against the dirty frontend implementation fingerprint: 9 tests passed
      in 24 seconds. Covered normal sign-in/returnTo/logout/reload, tampered
      state, denied authorization, rejected token exchange, unsolicited callback,
      external returnTo, profile 503 then retry with exactly one code exchange,
      profile 401 clearing local state without provider logout, and registration
      remaining POST /api/v1/auth/register followed by sign-in. Browser storage
      had no access/ID tokens; the sign-in request path never posted passwords
      to our API. Inspected test-results/oidc-simulation.ndjson and observed
      metadata, provider authorization/token/logout, Bearer profile and
      registration requests with expected success/error responses. Ports 3103
      and 3913 were no longer listening after Playwright cleanup. A prior
      attempt stopped because Next.js displayed its package security update
      reminder; retry ran the unchanged application successfully.
      On 2026-11-04 ran npm run test:auth:browser against the dirty
      oidc-envelope-merge fingerprint: all 11 scenarios passed in 29.4 seconds.
      The browser explicitly received GET /api/v1/users/me HTTP 200 and POST
      /api/v1/auth/register HTTP 201 with {code:0,message:"response success",data:user}.
      Sign-in returned to its requested page and registration navigated to
      sign-in. Missing envelope data and malformed user roles each produced
      the callback error, then succeeded on manual profile retry with exactly
      one code exchange. Inspected 137 simulation request events, including
      profile responses 200 (7), 401 (1) and 503 (1), registration 201 (1),
      token responses 200 (6) and 400 (1), and logout 302 (1). Ports 3103 and
      3913 stopped after cleanup and tsconfig.json was restored. The first
      attempt stopped for the existing Next.js advisory reminder; an unchanged
      retry produced the passing run. Postman CLI 1.73.0 rejects postman status
      as an unknown command; its local simulation command ran successfully.
      On 2026-11-05, at the shared-cart-hooks-develop-merge fingerprint,
      npm run test:auth:browser passed all 11 scenarios in 42.6 seconds after
      the installed Next advisory interrupted initial startup. An unchanged
      retry passed. Safe pathname/status log inspection confirmed one listening
      event and 125 requests, including profile 200 (7)/401 (1)/503 (1),
      registration 201 (1), token 200 (6)/400 (1) and logout 302 (1).
      This is current frontend/stand-in evidence; real token trust, provisioning
      and provider logout remain outside the simulated run.
    source: >-
      tests/oidc.spec.ts; playwright.auth.config.ts;
      postman/mocks/oidc-keycloak/default.js; postman/mocks/oidc-api/default.js;
      test-results/oidc-simulation.ndjson (local ignored run evidence)
    updated_at: "2026-11-05"
  - id: backend-keycloak-token-support
    status: unknown
    claim: >-
      The current committed backend accepts Keycloak tokens and provisions new
      registrations in Keycloak.
    reason: >-
      Incoming origin/develop 59631cd6 configures gateway and user-service
      trust against Keycloak and implements registration through its admin
      client. This source migration supersedes the 6e92bbac contradiction,
      but no backend runtime test or live Keycloak integration was run during
      this merge verification. The browser API fixture establishes frontend
      behavior against its model, not live backend token acceptance or
      registration provisioning.
    verification: >-
      On 2026-11-03 inspected the committed gateway/user-service configurations
      and registration service at 6e92bbac: both still trusted user-service
      issuer/JWKS and registration stored a local password without calling
      Keycloak. The realm README then assigned those migrations to issues
      237 and 238. On 2026-11-04 inspected incoming origin/develop 59631cd6:
      gateway and user-service now configure Keycloak issuer/JWKS; user-service
      configures the Keycloak admin client; registration creates the Keycloak
      user, assigns its realm role and stores the profile, with deletion
      compensation if role assignment or profile persistence fails. The
      historical contradiction no longer describes this source. Real token
      acceptance and registration against running backend/Keycloak services
      remain unverified; live integration is required to settle the claim.
    source: >-
      ../be-project-nexus/config-service/src/main/resources/config/api-gateway.yml;
      ../be-project-nexus/config-service/src/main/resources/config/user-service.yml;
      ../be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/UserService.java
    updated_at: "2026-11-04"
  - id: real-keycloak-rp-logout
    status: unknown
    claim: >-
      The deployed realm accepts the application's ID-token-hinted logout with
      the current origin as post_logout_redirect_uri and ends the SSO session.
    reason: >-
      The local provider fixture models this behavior. Keycloak 26.7.5 source
      falls back to the client's allowed redirectUris when no explicit
      post.logout.redirect.uris is configured, covering localhost:3000 here.
      No real provider is running, so deployed realm/session behavior remains
      unverified.
    verification: >-
      On 2026-11-03 inspected the realm and the upstream 26.7.5
      OIDCAdvancedConfigWrapper.getPostLogoutRedirectUris fallback and
      LogoutEndpoint redirect validation. Real discovery was unreachable.
      Simulated browser logout establishes caller behavior only.
    source: >-
      ../be-project-nexus/infra/local-dev/keycloak/realm-nexus.json;
      features/oidc.ts; postman/mocks/oidc-keycloak/default.js;
      https://github.com/keycloak/keycloak/blob/26.7.5/services/src/main/java/org/keycloak/protocol/oidc/OIDCAdvancedConfigWrapper.java;
      https://github.com/keycloak/keycloak/blob/26.7.5/services/src/main/java/org/keycloak/protocol/oidc/endpoints/LogoutEndpoint.java
    updated_at: "2026-11-03"
  - id: backend-user-success-envelope
    status: supported
    claim: >-
      The committed backend wraps GET /api/v1/users/me HTTP 200 and POST
      /api/v1/auth/register HTTP 201 user payloads in {code,message,data}.
    reason: >-
      Both user-service controllers call ApiResponse.of. That record always
      serializes code, message and data, defaulting to code 0 and message
      response success. The previous API fixture returned raw users, so its
      historical passing browser run did not establish envelope compatibility.
    verification: >-
      On 2026-11-04 inspected origin/develop 0d14ca45 ApiResponse,
      AuthController.register and UserController.getMe. Updated the local API
      fixture to the delivered contract and added explicit browser assertions
      for 200 profile and 201 registration envelopes plus missing-data and
      malformed-user retries. The merged implementation accepted both valid
      envelopes in the 2026-11-04 simulated-browser-flow run, while rejecting
      the missing data and invalid user before a successful manual retry.
    source: >-
      ../be-project-nexus/lib/common-core/src/main/java/com/group5/common_core/model/ApiResponse.java;
      ../be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/AuthController.java;
      ../be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/UserController.java;
      postman/mocks/oidc-api/default.js; tests/oidc.spec.ts
    updated_at: "2026-11-04"
  - id: cart-oidc-merge-integration
    status: supported
    claim: >-
      The merged frontend preserves snapshot cart totals, optimistic edits,
      rollback and account isolation when sign-in and logout use OIDC in the
      local browser scenarios exercised.
    reason: >-
      Cart browser tests traverse the actual PKCE redirect and callback against
      the existing Postman Keycloak stand-in. Profile and cart requests are
      checked against its issued access tokens. Cart responses and delayed
      writes are explicit Playwright HTTP fixtures, not live backend evidence.
    verification: >-
      On 2026-11-04, at the cart-oidc-develop-merge fingerprint, npm run
      test:browser passed all 30 scenarios, including all 9 cart scenarios.
      After isolating the header cart GET in the product/OIDC suites, npm run
      test:browser -- product.spec.ts passed all 3 product scenarios and npm run
      test:auth:browser passed all 11 OIDC scenarios in 28.1 seconds. The final
      OIDC simulation log contained 124 request events, including profile 200
      (7), 401 (1), 503 (1), registration 201 (1), token 200 (6), token 400 (1)
      and logout 302 (1). Header cart fixtures kept those reads off the local
      gateway proxy. Initial browser starts stopped for the existing Next.js
      security reminder; unchanged retries passed. No live backend was tested.
      On 2026-11-05, at the shared-cart-hooks-develop-merge fingerprint,
      npm run test:browser passed 30/30, npm run test:cart passed the nine
      shared Cart HTTP scenarios, npm run test:profile passed 9/9 and the
      dedicated OIDC run passed 11/11. Shared Cart hooks retain the optimistic
      page wrapper and session-generation guards. The separate cart/profile
      context files record their request counts and current fixture wiring.
    source: >-
      tests/cart.spec.ts; tests/product.spec.ts; tests/oidc.spec.ts;
      features/ShopLayout.tsx; hooks/useCart.ts; features/useCart.ts;
      test-results/oidc-simulation.ndjson (local ignored run evidence)
    updated_at: "2026-11-05"
