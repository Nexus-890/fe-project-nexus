purpose:
  stands_in_for: >-
    Local Keycloak OIDC endpoints and the profile/registration API, derived from
    infra/local-dev/keycloak/realm-nexus.json, service/auth.ts and UserResponse.
    The CLI is signed out, so published owner mocks were not searched or pulled.
  unblocks: >-
    Real browser verification of the Next.js sign-in callback, PKCE exchange,
    in-memory authentication, logout, and unchanged registration while Docker
    and the real services are unavailable. Uses one-port routing because browser
    fetch and navigation are configured with explicit local dependency origins.
assumptions:
  - id: keycloak-code-pkce-contract
    status: supported
    claim: >-
      The committed nexus-web realm client is public, enables Authorization Code,
      requires PKCE S256 and emits the claims expected by the project.
    reason: >-
      The realm configuration and its README define these settings. The local
      provider fixture additionally checks verifier/challenge binding and
      one-use authorization codes; this does not validate a running Keycloak.
    verification: >-
      On 2026-11-03 inspected the realm client, protocol mappers and README on
      origin/develop at 6e92bbac. Browser fixture verification is recorded in the
      simulated-browser-flow claim below. Live Keycloak discovery refused connection and
      Docker Desktop's daemon was unavailable.
    source: >-
      ../be-project-nexus/infra/local-dev/keycloak/realm-nexus.json;
      ../be-project-nexus/infra/local-dev/keycloak/README.md;
      postman/mocks/oidc-keycloak/default.js; tests/browser/oidc.spec.ts
    updated_at: "2026-11-03"
  - id: simulated-browser-flow
    status: supported
    claim: >-
      In the nine local browser scenarios, the real Next.js client uses code
      exchange with PKCE, restores safe return destinations, sends the issued
      access token to the API and clears local authentication on logout.
    reason: >-
      Playwright runs the actual application and browser networking against
      the two local dependency fixtures. The provider validates the PKCE
      verifier against the authorization challenge; the API compares the Bearer
      token hash with the access token actually issued. These are caller
      integration checks under the fixture contract, not live provider proof.
    verification: >-
      On 2026-11-03 ran npx playwright test --config playwright.auth.config.ts
      against the dirty frontend implementation fingerprint: 9 tests passed
      in 24 seconds. Covered normal sign-in/returnTo/logout/reload, tampered
      state, denied authorization, rejected token exchange, unsolicited callback,
      external returnTo, profile 503 then retry with exactly one code exchange,
      profile 401 clearing local state without provider logout, and registration
      remaining POST /api/v1/auth/register followed by sign-in. Browser storage
      had no access/ID tokens; the sign-in request path never posted passwords
      to our API. Inspected test-results/oidc-simulation.ndjson and observed
      metadata, provider authorization/token/logout, Bearer profile and
      registration requests with expected success/error responses. Ports 3103
      and 3913 were no longer listening after Playwright cleanup. A prior
      attempt stopped because Next.js displayed its package security update
      reminder; retry ran the unchanged application successfully.
    source: >-
      tests/browser/oidc.spec.ts; playwright.auth.config.ts;
      postman/mocks/oidc-keycloak/default.js; postman/mocks/oidc-api/default.js;
      test-results/oidc-simulation.ndjson (local ignored run evidence)
    updated_at: "2026-11-03"
  - id: backend-keycloak-token-support
    status: contradicted
    claim: >-
      The current committed backend accepts Keycloak tokens and provisions new
      registrations in Keycloak.
    reason: >-
      The gateway and user-service still trust user-service issuer/JWKS, and
      registration hashes a password into the local database without calling
      Keycloak. The browser API fixture models the intended integration so the
      frontend can be tested; it does not establish backend readiness.
    verification: >-
      On 2026-11-03 inspected the committed gateway/user-service configurations
      and registration service at 6e92bbac. Realm README assigns the issuer/JWKS
      migration to issue 237 and the user-service auth migration to issue 238.
    source: >-
      ../be-project-nexus/config-service/src/main/resources/config/api-gateway.yml;
      ../be-project-nexus/config-service/src/main/resources/config/user-service.yml;
      ../be-project-nexus/user-service/src/main/java/com/group5/userservice/iam/UserService.java
    updated_at: "2026-11-03"
  - id: real-keycloak-rp-logout
    status: unknown
    claim: >-
      The deployed realm accepts the application's ID-token-hinted logout with
      the current origin as post_logout_redirect_uri and ends the SSO session.
    reason: >-
      The local provider fixture models this behavior. Keycloak 26.7.5 source
      falls back to the client's allowed redirectUris when no explicit
      post.logout.redirect.uris is configured, covering localhost:3000 here.
      No real provider is running, so deployed realm/session behavior remains
      unverified.
    verification: >-
      On 2026-11-03 inspected the realm and the upstream 26.7.5
      OIDCAdvancedConfigWrapper.getPostLogoutRedirectUris fallback and
      LogoutEndpoint redirect validation. Real discovery was unreachable.
      Simulated browser logout establishes caller behavior only.
    source: >-
      ../be-project-nexus/infra/local-dev/keycloak/realm-nexus.json;
      features/auth/oidc.ts; postman/mocks/oidc-keycloak/default.js;
      https://github.com/keycloak/keycloak/blob/26.7.5/services/src/main/java/org/keycloak/protocol/oidc/OIDCAdvancedConfigWrapper.java;
      https://github.com/keycloak/keycloak/blob/26.7.5/services/src/main/java/org/keycloak/protocol/oidc/endpoints/LogoutEndpoint.java
    updated_at: "2026-11-03"
fingerprints:
