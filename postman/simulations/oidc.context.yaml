  - id: real-merge-is-atomic-and-idempotent
    status: unknown
    claim: >-
      The future backend atomically consumes a guest cart and applies its quantities at most once
      per user, token and merge key, including retries after a lost success response and a later
      sign-in.
    reason: >-
      This guarantee is required for safe retry and multiple tabs. The fixture models it, but no
      backend implementation or agreed retention period exists.
    verification: >-
      On 2026-11-03 the committed-response 503 browser scenario demonstrated frontend reuse of the
      same key, and the stand-in applied quantities once. Provider-side verification requires the
      delivered merge endpoint and tests of concurrent calls, ownership and key retention. The
      2026-11-05 guest-cart-develop-merge browser run again demonstrated frontend key reuse in the
      pre-commit and committed-response failure scenarios. It does not settle real backend atomicity
      or retention; this provider claim remains unknown.
    source: >-
