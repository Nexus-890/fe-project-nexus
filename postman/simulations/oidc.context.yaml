  - id: backend-user-success-envelope
    status: supported
    claim: >-
      The committed backend wraps GET /api/v1/users/me HTTP 200 and POST /api/v1/auth/register HTTP
      201 user payloads in {code,message,data}.
    reason: >-
      Both user-service controllers call ApiResponse.of. That record always serializes code, message
