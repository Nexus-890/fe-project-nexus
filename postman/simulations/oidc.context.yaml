  - id: delivered-cart-count-contract
    status: supported
    claim: >-
      The delivered commerce CartResponse supplies cart ID, ACTIVE status and item ID, SKU ID and
      integer quantities needed by the header count.
    reason: >-
      Current Java DTOs define these fields. The frontend count model accepts the actual
      numeric-price payload without requiring the extra fields present only in the older frontend
      draft. The merged HTTP boundary requires the delivered success envelope for cart responses.
    verification: >-
      On 2026-11-03 inspected CartResponse.java and CartItemResponse.java at 4c1139ab. Unit tests
      accept delivered and draft payloads and reject invalid or overflowing quantities. The member
      GET fixture returns an envelope; additions and merges return bare DTO-shaped data. That
      describes the historical 2026-11-03 fixture. On 2026-11-05 the merged fixture returns strict
      {code,message,data} envelopes for member, guest and merge successes. The final 94
      unit/transport tests and 17-scenario auth browser run passed against the merged
      implementation; the latter exercised numeric snapshot prices in enveloped cart responses.
    source: >-
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/cart/dto/response/CartResponse.java;
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/cart/dto/response/CartItemResponse.java;
      features/cartSnapshotUtils.ts; tests/cart.test.ts
    updated_at: '2026-11-05'
  - id: simulated-guest-cart-flow
    status: supported
