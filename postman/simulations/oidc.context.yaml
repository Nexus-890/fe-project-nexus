      and Keycloak, merges once before returning to the shop, and retries a failed merge using the
      original idempotency key.
    reason: >-
      The six guest browser scenarios exercise real browser HTTP and the existing OIDC flow,
      including provider PKCE checks. They assert quantities, storage and request evidence. Backend
      support is not established by these stand-ins.
    verification: >-
      On 2026-11-03 the final npm run test:auth:browser passed all 14 scenarios in 34.4 seconds,
      including the nine existing OIDC scenarios. Observed the same stored guest credential while
      the browser was at Keycloak, then that credential on exactly one callback merge request and a
      merged count of 5 from guest 2 plus member 3. Reload restored the guest count; later client
      navigation did not repeat merge; logout and reload showed anonymous count 0. Both pre-write
      503 and committed-write/failed-response 503 retained the key for retry, with one applied merge
      in fixture state. Guest-disabled 403 showed sign-in. Inspected the simulation log: guest
      creation 201, additions 201, guest GET 200, merge 200/503, member GET 200 and disabled
      creation 403 all ran. Unit suite passed 65 tests including frontend flag false, blocked
      storage, expired carts and stale auth responses. A first token-persistence test observation
      used an unsupported redirect interception point; it was corrected to inspect storage on the
      provider page. Next's pre-existing security reminder caused startup/build attempts to exit;
      retries completed. On 2026-11-05, at the dirty guest-cart-develop-merge fingerprint, the final
      npm run test:auth:browser passed all 17 cases in 41.5 seconds, including six guest cases and
      eleven OIDC cases. Guest cases retained the reload, mobile quantity, redirect persistence, one
      callback merge, logout, disabled-cart and same-key pre-/post-commit failure checks. The added
      profile-503 recovery case confirmed no merge before explicit account retry, then one merge
      with the saved key and one code exchange. Same-origin cart requests were forwarded over HTTP
