purpose:
  stands_in_for: >-
    The payment-service initiation API, order reads/status changes and the profile/catalog/cart endpoints used
    by the real Next.js payment page, plus the existing local Keycloak protocol
    fixture. The payment mock follows the delivered payment OpenAPI and DTOs with
    the additive serverNow and transferContent fields. Published owner mocks were
    not searched: no owner workspace was identified, postman status is unsupported
    by installed CLI 1.73.0, and postman mock list --json returned an empty list.
    The order-group GET is an explicit #153/#138 stand-in based on the existing
    OrderGroupResponse DTO; this route is not yet delivered by the backend.
  unblocks: >-
    Browser acceptance for one group QR, selectable/copyable transfer values,
    a server-derived deadline, expiry, repeat reads and failures while the live
    backend/Keycloak are unavailable. One-port routing uses explicit browser API
    and provider origins on 3914 and the application on 3104, preserving existing
    development sessions on 3913. Payment.environment.yaml configures the shared
    Keycloak fixture without changing its default origins. The polling suite
    additionally exercises child-order transitions, confirmation navigation,
    cancellation, hidden-tab suspension and stale-response guards.
assumptions:
  - id: delivered-payment-fields
    status: supported
    claim: >-
      The local backend source contract returns HTTP 201 with ApiResponse.data
      containing immutable group instructions, a numeric whole-VND amount,
      serverNow and the exact bank transferContent including any bank prefix.
    reason: >-
      The delivered OpenAPI, response record, service and SePay adapter agree on
      these fields. This supports the source contract; it does not establish
      that an already deployed service has the additive fields.
    verification: >-
      On 2026-11-04 inspected the dirty payment-qr-countdown source fingerprint.
      The frontend service validates both timing fields and transferContent.
      The mock returns the stable memo NX20261104001, full transfer content
      SEVQR NX20261104001 and a total of 350000 from two seeded shop amounts
      of 200000 and 150000. Backend runtime validation is recorded separately
      in the payment implementation report, not inferred from this mock.
    source: >-
      ../be-project-nexus/docs/api/openapi/payment-service.yaml;
      ../be-project-nexus/payment-service/src/main/java/com/group5/paymentservice/payment/dto/response/PaymentInitResponse.java;
      service/paymentService.ts; postman/mocks/payment-api/default.js
    updated_at: "2026-11-04"
  - id: payment-browser-acceptance
    status: supported
    claim: >-
      In nine local browser scenarios, the real frontend renders one group QR
      and selectable values, copies raw account/amount and prefixed memo, keeps
      the server-derived deadline when the laptop clock is one hour ahead,
      preserves memo after refresh/reload with reauthentication, expires at zero,
      and hides stale QR instructions after malformed or failed refreshes.
    reason: >-
      Playwright runs the actual Next.js page and Axios boundary against real
      local HTTP Postman dependency servers. The API compares Bearer hashes with
      the token issued by the provider fixture and validates the request body.
      Only the browser clipboard boundary is replaced to inspect copy values and
      denied permission handling. The group/session and expiry persist in pm.state.
    verification: >-
      On 2026-11-04 ran npm run test:payment with the payment-qr-countdown
      fingerprint: all 9 scenarios passed in 33.2 seconds. Assertions cover
      signed-out access without a payment request; one QR for two shops; each
      selectable field and copy value; QR bounds wholly within the initial
      375x812 viewport and no horizontal overflow; an hour-ahead clock followed
      by explicit refresh and full reload/sign-in; zero deadline with no QR and
      disabled copy; clipboard denial; Problem Details 503 with manual recovery;
      missing serverNow; success then malformed refresh then 503 retry then
      valid recovery; and 409 non-payable refresh removing prior instructions.
      Inspected the simulation log: 179 request events (API 125, Keycloak 54),
      including payment POST 201 (20), 409 (1), 503 (3). Three HTTP 201 bodies
      intentionally omitted serverNow and were rejected. Development StrictMode
      can send a canceled idempotent read twice; explicit refresh adds one read.
      Captured mobile, desktop and expired screenshots. Ports 3104/3914 stopped
      after cleanup. Earlier attempts were stopped by the existing Next.js
      security advisory; an unchanged retry reached this passing run. Harness
      corrections scoped alerts to main (excluding Next's route announcer),
      reset scroll after clipboard clicks, and measured explicit-refresh calls
      relative to StrictMode mount reads. No live backend was exercised.
    source: >-
      tests/payment.spec.ts; playwright.payment.config.ts;
      postman/mocks/payment-api/default.js; tests/payment-fixture.mjs;
      test-results/payment-simulation.ndjson (local ignored evidence);
      docs/features/payment-evidence/
    updated_at: "2026-11-04"
  - id: order-group-endpoint-delivery
    status: unknown
    claim: >-
      GET /api/v1/orders/groups/{id} returns ApiResponse.data containing the
      requested group's OrderGroupResponse and current child-order statuses.
    reason: >-
      Issue #153 explicitly permits a mock until #138 merges. The existing DTO
      defines the shape, but the fetched #152 base has no GET group controller
      or delivered OpenAPI path. The fixture can establish frontend behavior
      under that shape, not backend endpoint availability or authorization.
    verification: >-
      On 2026-11-04 inspected the #152 base bbfcb7e8, OrderController and
      OrderGroupResponse. The mock keeps group status PENDING while individual
      child orders are changed by HTTP PATCH, matching the demo distinction in
      the issue. A test-only fixture-admin identity permits those mock PATCH
      calls; real ADMIN authorization and checkout reconciliation remain unverified.
    source: >-
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/controller/OrderController.java;
      ../be-project-nexus/commerce-service/src/main/java/com/group5/commerceservice/order/dto/response/OrderGroupResponse.java;
      postman/mocks/payment-api/default.js; tests/payment-polling.spec.ts
    updated_at: "2026-11-04"
  - id: payment-status-browser-acceptance
    status: supported
    claim: >-
      In the local polling scenarios, the real frontend reads child-order
      statuses on a three-second cadence, confirms only when every child is
      PAID, shows a canceled state when all are CANCELED, and stops polling on
      terminal state, countdown expiry or hidden-tab visibility.
    reason: >-
      Playwright runs the actual Next.js page, generic query hook and Axios
      boundary against local HTTP dependency servers. Child transitions use
      real HTTP PATCH requests to the stand-in, whose group status remains
      PENDING. Tab visibility is the sole replaced browser boundary in the
      suspension checks; the thirty-second interval and HTTP requests use real
      elapsed time. This is evidence about the caller under these modeled
      responses, not evidence of delivered #138 or live payment reconciliation.
    verification: >-
      On 2026-11-04, against the payment-status-polling fingerprint, npm run
      test:payment executed 18 scenarios: 17 passed, and the cadence/PAID test
      reached the correct confirmed UI but failed an elapsed assertion at
      3035.99 ms because a repeated URL assertion included sampling backoff.
      Replaced only that measurement with the navigation event, measured from
      the successful PATCH response. The targeted command npm run test:payment
      -- --grep 'polls child statuses' then passed in 29.6 seconds (20.3 seconds
      for the test), including navigation inside three seconds and both order
      rows displayed as PAID. The other eight polling cases passed in the full
      run: partial/mixed child states did not confirm; all canceled stopped;
      zero countdown stopped and stayed stopped after visibility restoration;
      a hidden tab made no requests for thirty real seconds; malformed empty
      groups failed closed; a 503 displayed detail and recovered on the next
      poll; and delayed PAID responses could not confirm while hidden or after
      expiry. All nine prior QR/countdown cases passed. Inspected logs from the
      full run (468 HTTP requests, 27 group reads, one group 503, 12 PATCH 200s)
      and targeted run (55 HTTP requests, five group reads, two PATCH 200s).
      The latter returned one all-PAID snapshot while group status was PENDING.
      Saved and visually inspected confirmed/canceled mobile screenshots.
      Next's pre-existing security advisory blocked initial startup; unchanged
      retries reached the executed scenarios. No live backend was exercised.
    source: >-
      tests/payment-polling.spec.ts; tests/payment.spec.ts;
      postman/mocks/payment-api/default.js; features/usePaymentStatus.ts;
      test-results/payment-full-simulation.ndjson (ignored local full-run log);
      test-results/payment-simulation.ndjson (ignored local targeted-run log);
      docs/features/payment-evidence/payment-confirmed.png;
      docs/features/payment-evidence/payment-canceled.png
    updated_at: "2026-11-04"
  - id: real-bank-provider-and-deployment
    status: unknown
    claim: >-
      Deployed backend/Keycloak authorization, live CORS, external VietQR image
      loading/scannability and actual transfer reconciliation match this contract.
    reason: >-
      Browser checks use a local protocol fixture and a deterministic QR-shaped
      SVG. That SVG isolates image/layout behavior and is not a scannable bank
      instruction. A fixture cannot establish real provider behavior or deployment.
    verification: >-
      On 2026-11-04 only the local Postman/browser scenarios were run for this
      record. No real bank transfer or deployed backend/Keycloak was called.
      Verify the updated backend fields, current realm/privileges, browser CORS,
      the provider's actual QR image and transfer matching in the integration
      environment before recording live compatibility.
    source: >-
      postman/mocks/payment-api/default.js; postman/mocks/oidc-keycloak/default.js;
      docs/features/payment.md; ../be-project-nexus/docs/adr/ADR-008-api-contract.md
    updated_at: "2026-11-04"
  - id: payment-after-develop-cookie-session
    status: supported
    claim: >-
      The payment page retains the same payment reference after a reload that
      restores authentication through the current gateway HttpOnly cookie.
      Existing QR, server-time countdown, expiry and failure-recovery scenarios
      continue to pass against the local HTTP dependencies after the develop merge.
    reason: >-
      The payment simulation now reuses oidc-api as its gateway session member
      instead of bypassing the gateway token exchange. The real frontend keeps
      the restoring state until the cookie refresh and profile request finish.
    verification: >-
      On 2026-11-06 ran npm run test:payment on the payment-develop-20261106
      fingerprint: all 9 browser scenarios passed in 43.2 seconds. The original
      Turbopack configuration was used with local dependencies after Windows
      junction attempts failed before application startup. Inspected the log:
      268 dependency requests, 8 gateway code exchanges, one successful
      cookie refresh on reload, payment 201/503/409 responses, and no unmodeled
      endpoints. The header notification reads return an empty delivered envelope.
      Earlier 2026-11-04 reload evidence required sign-in; that assertion has been
      updated for the gateway cookie lifecycle now merged into develop.
    source: >-
      tests/payment.spec.ts; features/CheckoutPaymentPage.tsx;
      postman/mocks/payment-api/default.js; postman/mocks/oidc-api/default.js;
      postman/simulations/payment.sim.yaml;
      test-results/payment-simulation.ndjson (ignored local run evidence)
    updated_at: "2026-11-06"
  - id: polling-after-develop-cookie-session
    status: supported
    claim: >-
      All nine polling scenarios and nine payment QR/countdown scenarios continue
      to pass with the gateway cookie-session flow merged from develop.
    reason: >-
      The real frontend runs through the shared HTTP boundary and local Postman
      dependencies. Session forwarding and notification envelopes remain intact
      while the group-status read, deadline and visibility lifecycle are exercised.
    verification: >-
      On 2026-11-06 ran npm run test:payment on polling-develop-20261106:
      all 18 scenarios passed in 2.5 minutes. Inspected 660 dependency requests,
      including 27 group reads, one group 503, 12 successful admin PATCH triggers
      and no unmodeled endpoints. Navigation after all children became PAID
      occurred within three seconds; hidden tabs sent no polls for thirty real
      seconds; cancellation, expiry, mixed/empty groups, 503 recovery and delayed
      response guards passed. The prior attempt stopped when the existing Next
      advisory exited the app after readiness; the unchanged retry completed.
      No real order-group read or bank provider was called.
    source: >-
      tests/payment-polling.spec.ts; tests/payment.spec.ts;
      features/usePaymentStatus.ts; postman/mocks/payment-api/default.js;
      postman/simulations/payment.sim.yaml;
      test-results/payment-simulation.ndjson (ignored local run evidence)
    updated_at: "2026-11-06"
  - id: stacked-order-list-navigation-timing
    status: contradicted
    claim: >-
      Every all-PAID transition reaches the full account order-list URL within
      the strict three-second local browser acceptance bound.
    reason: >-
      The stacked payment check reached its confirmed state but exceeded the
      unchanged three-second navigation timeout. Warming the browser account
      destination did not remove the failure. The separate hidden-tab scenario
      passed its thirty-second pause, resume navigation and confirmation banner.
    verification: >-
      On 2026-11-06 ran the focused payment-polling scenarios after merging
      b7c923a5 into the full order-list implementation c40ae3e3. The steady
      all-PAID scenario exceeded page.waitForURL's 3000ms bound in two exercised
      runs, with the page already showing its confirmed/loading-orders state.
      Group requests and admin PATCHes executed against the local simulation.
      The hidden-tab scenario passed in 32.1 seconds. Retained the original
      HTTP warmup, three-second assertion and production polling interval.
      A final focused run measured navigation commit explicitly with
      waitUntil commit and also exceeded 3000ms. Existing Next advisory exits
      required unchanged retries before application scenarios could run. No live
      backend timing claim follows from these results.
    source: tests/payment-polling.spec.ts; features/CheckoutPaymentPage.tsx; features/OrdersPage.tsx
    updated_at: '2026-11-06'
