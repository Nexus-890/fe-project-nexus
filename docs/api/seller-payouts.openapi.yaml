openapi: 3.0.3
info:
  title: PROPOSED seller bank accounts and payouts — pending backend issue 261
  version: 0.1.0-proposed
  description: |
    Frontend integration proposal and explicit HTTP simulation input for #225/#261.
    No delivered backend controller or OpenAPI implements these operations at the
    #225 develop baseline. This file does not extend the delivered service contract
    and is deliberately excluded from delivered DTO generation. Backend #261 must
    confirm paths, privileges, fields, verification workflow and transactional rules.
    Production UI sends real requests and displays unavailable errors; it never
    supplies fake bank accounts, records a local payout or triggers a bank transfer.
    All operations are protected. SELLER reads are scoped to JWT sub; another
    seller's account data is forbidden. Admin verification is owned by backend #261
    and no production verification control is proposed in this frontend.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/sellers/me/bank-accounts:
    get:
      summary: List only the signed-in seller's masked bank accounts
      x-proposed-role: SELLER
      responses:
        '200':
          description: Own accounts only. Never return a full bank account number.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - properties:
                      data:
                        type: array
                        items: {$ref: '#/components/schemas/BankAccount'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Unavailable'}
    post:
      summary: Add an unverified bank account for the JWT seller
      x-proposed-role: SELLER
      description: |
        Full account number is write-only and must be protected by the owning BE.
        Client cannot choose sellerId or set verified. Do not log account numbers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bankCode, bankName, accountHolder, accountNumber]
              properties:
                bankCode: {type: string, minLength: 1, maxLength: 32, pattern: '^[A-Za-z0-9_-]+$'}
                bankName: {type: string, minLength: 1, maxLength: 100}
                accountHolder: {type: string, minLength: 1, maxLength: 100}
                accountNumber: {type: string, writeOnly: true, pattern: '^\d{6,34}$'}
      responses:
        '201':
          description: Created masked account with verified false
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - properties:
                      data: {$ref: '#/components/schemas/BankAccount'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Unavailable'}
  /api/v1/sellers/me/payouts:
    get:
      summary: Read only the JWT seller's payout history and status
      x-proposed-role: SELLER
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Newest payouts first, scoped by JWT seller identity
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PagedEnvelope'}
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/Payout'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Unavailable'}
  /api/v1/payouts/payable-orders:
    get:
      summary: List completed orders with no payout and no refund
      x-proposed-role: ADMIN
      description: |
        Backend filtering is mandatory: status COMPLETED, payoutId null and
        refundStatus null. Include masked seller-owned bank accounts and their
        verification status so an administrator can choose a verified account.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Eligible orders; never PAID, SHIPPED, DELIVERED or REFUND_REQUESTED
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/PagedEnvelope'}
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/PayableOrder'}}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Unavailable'}
  /api/v1/payouts:
    post:
      summary: Create one payout for a completed order and verified seller bank account
      x-proposed-role: ADMIN
      description: |
        Validate ownership, bank verification, COMPLETED status, absence of refund
        and absence of prior payout atomically. Non-completed order returns 409
        PAYOUT_ORDER_NOT_COMPLETED and records nothing. Unverified account returns
        409 PAYOUT_BANK_ACCOUNT_UNVERIFIED and records nothing. A payout already
        exists returns 409 PAYOUT_ALREADY_EXISTS for a fresh key. Same administrator,
        UUID key and identical payload replays the same payout with 200; changed
        payload returns 409 PAYOUT_IDEMPOTENCY_CONFLICT. A unique order constraint
        prevents distinct concurrent keys from creating duplicate payouts. Amount,
        seller identity and currency come from server order data. Retry after an
        uncertain response must retain the same key and payload. No automatic retry.
        This request records a payout instruction; settlement/provider behavior
        remains a backend #261 decision and is not simulated as a real bank transfer.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderId, bankAccountId]
              properties:
                orderId: {type: string, format: uuid}
                bankAccountId: {type: string, format: uuid}
      responses:
        '201': {$ref: '#/components/responses/Payout'}
        '200': {$ref: '#/components/responses/Payout'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Page: {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
    Size: {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
  responses:
    Payout:
      description: Payout instruction, masked bank snapshot; replay returns the same ID
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - properties:
                  data: {$ref: '#/components/schemas/Payout'}
    Problem:
      description: Problem Details; no success record is fabricated
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, code, detail]
            properties:
              title: {type: string}
              status: {type: integer}
              code: {type: string}
              detail: {type: string}
    Unavailable:
      description: Backend issue 261 is not delivered; UI displays unavailable/retry state
  schemas:
    Envelope:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, enum: [0]}
        message: {type: string}
    PagedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/Envelope'}
        - type: object
          required: [page]
          properties:
            page:
              type: object
              required: [number, size, totalElements, totalPages]
              properties:
                number: {type: integer, minimum: 0}
                size: {type: integer, minimum: 1}
                totalElements: {type: integer, minimum: 0}
                totalPages: {type: integer, minimum: 0}
    BankAccount:
      type: object
      additionalProperties: false
      required: [id, bankCode, bankName, accountHolder, last4, verified, createdAt]
      properties:
        id: {type: string, format: uuid}
        bankCode: {type: string, minLength: 1, maxLength: 32}
        bankName: {type: string, minLength: 1, maxLength: 100}
        accountHolder: {type: string, minLength: 1, maxLength: 100}
        last4: {type: string, pattern: '^\d{4}$'}
        verified: {type: boolean}
        createdAt: {type: string, format: date-time}
    Payout:
      type: object
      required: [id, orderId, orderNumber, bankAccount, amount, status, createdAt, paidAt, reference]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        bankAccount: {$ref: '#/components/schemas/BankAccount'}
        amount: {type: number, minimum: 0.01, description: Numeric wire VND amount}
        status: {type: string, enum: [PENDING, PROCESSING, PAID, FAILED]}
        createdAt: {type: string, format: date-time}
        paidAt: {type: string, format: date-time, nullable: true}
        reference: {type: string, nullable: true}
    PayableOrder:
      type: object
      required: [orderId, orderNumber, sellerId, sellerName, totalAmount, completedAt, status, payoutId, refundStatus, bankAccounts]
      properties:
        orderId: {type: string, format: uuid}
        orderNumber: {type: string}
        sellerId: {type: string, format: uuid}
        sellerName: {type: string}
        totalAmount: {type: number, minimum: 0.01}
        completedAt: {type: string, format: date-time}
        status: {type: string, enum: [COMPLETED]}
        payoutId: {type: string, nullable: true, enum: [null]}
        refundStatus: {type: string, nullable: true, enum: [null]}
        bankAccounts: {type: array, items: {$ref: '#/components/schemas/BankAccount'}}
