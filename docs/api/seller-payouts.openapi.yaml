openapi: 3.0.3
info:
  title: Issue-aligned seller payout reads and administrator retry
  version: 0.2.0-issue-257-261
  description: >-
    Frontend integration contract for the #257 payout API and the separate #261
    administrator list follow-up. Production uses real requests and preserves
    backend failures; local simulations are test-only.
    Payout creation is automatic after OrderCompleted for a funded COMPLETED order
    without refunds and positive net amount. There is no payout-create or payable-list
    endpoint. Platform fee is rounded half up to two decimals from
    (orderAmount - shippingFee) * platformFeeRate; netAmount is that base minus the
    fee. The delivered backend serializes amounts and rate as JSON numbers; the
    frontend normalizes them into exact decimal strings before rendering. Each payout
    retains its fee-rate snapshot. A provider acknowledgement is not transfer success.
    Seller profile and bank management use the separate issue 257 contracts under
    /api/v1/sellers/me and /api/v1/payments/seller-bank-accounts; they do not create
    payouts. A verified default account releases ON_HOLD payouts automatically.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/payments/payouts/me:
    get:
      operationId: getOwnPayouts
      summary: Read payouts scoped to the JWT seller
      description: SELLER only, newest first. Identity comes from JWT sub, never a sellerId query.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {$ref: '#/components/responses/PayoutPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Unavailable'}
  /api/v1/payments/payouts:
    get:
      operationId: getAdminPayouts
      summary: Administrator payout list with seller, status and date filters
      description: >-
        ADMIN only; SELLER and SUPPORT_STAFF receive 403. Newest first. Needs action
        sends exactly four repeated status parameters ON_HOLD, UNKNOWN, FAILED,
        RETURNED. Lists read stored payouts and never calculate or create a payout.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {in: query, name: sellerId, schema: {type: string, format: uuid}}
        - in: query
          name: status
          style: form
          explode: true
          schema: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/PayoutStatus'}}
        - {in: query, name: from, schema: {type: string, format: date-time}}
        - {in: query, name: to, schema: {type: string, format: date-time}}
      responses:
        '200': {$ref: '#/components/responses/PayoutPage'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Unavailable'}
  /api/v1/payments/payouts/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getPayoutDetail
      summary: Owner or administrator detail with newest-first payout history
      description: Another seller's payout is 404 PAYOUT_NOT_FOUND. No full bank account number is returned.
      responses:
        '200': {$ref: '#/components/responses/PayoutDetail'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Unavailable'}
  /api/v1/payments/payouts/{id}/retry:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: retryPayout
      summary: Administrator retry of an existing failed or returned payout
      description: >-
        ADMIN only. Bodyless POST with a UUID Idempotency-Key per explicit retry
        request. Reuse that exact key after an uncertain response; the same key
        records one RETRIED action, never a second payout or attempt. Only FAILED
        and RETURNED are eligible; all other states return 409 PAYOUT_NOT_RETRYABLE.
        UNKNOWN must reconcile the original provider attempt and cannot be retried.
        Recipient account verification and ownership remain server checks. Retry
        does not prove payment success. The dispatch/provider transaction owns
        attempt counting, frozen recipient snapshots and confirmed transfers.
      parameters:
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {$ref: '#/components/responses/PayoutDetail'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '501': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Page: {in: query, name: page, schema: {type: integer, minimum: 0, default: 0}}
    Size: {in: query, name: size, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
  responses:
    PayoutPage:
      description: Stored payouts, newest first, with sibling page metadata
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data, page]
            properties:
              code: {type: integer, example: 0}
              message: {type: string}
              data: {type: array, items: {$ref: '#/components/schemas/Payout'}}
              page:
                type: object
                required: [number, size, totalElements, totalPages]
                properties:
                  number: {type: integer, minimum: 0}
                  size: {type: integer, minimum: 1}
                  totalElements: {type: integer, minimum: 0}
                  totalPages: {type: integer, minimum: 0}
    PayoutDetail:
      description: Current payout and append-only newest-first history
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {type: integer, example: 0}
              message: {type: string}
              data:
                allOf:
                  - {$ref: '#/components/schemas/Payout'}
                  - type: object
                    required: [history]
                    properties:
                      history: {type: array, items: {$ref: '#/components/schemas/HistoryStep'}}
    Problem:
      description: Problem Details; PAYOUT_NOT_FOUND 404, PAYOUT_NOT_RETRYABLE 409, or owning service ErrorCode
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status]
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              code: {type: string}
              detail: {type: string}
    Unavailable:
      description: Backend capability is not delivered; UI shows the failure and explicit refresh
  schemas:
    Money:
      oneOf:
        - type: number
          minimum: 0
        - type: string
          pattern: '^\d{1,17}\.\d{2}$'
      example: 4770000
    PayoutStatus:
      type: string
      enum: [ON_HOLD, PENDING, PROCESSING, UNKNOWN, SUCCEEDED, FAILED, RETURNED]
    Payout:
      type: object
      required: [id, orderId, sellerId, orderAmount, shippingFee, platformFeeRate, platformFee, netAmount, currency, status, attemptCount, recipientAccountLast4, createdAt]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        sellerId: {type: string, format: uuid}
        orderAmount: {$ref: '#/components/schemas/Money'}
        shippingFee: {$ref: '#/components/schemas/Money'}
        platformFeeRate:
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: string
              pattern: '^(?:0(?:\.\d{1,4})?|1(?:\.0{1,4})?)$'
          example: 0
        platformFee: {$ref: '#/components/schemas/Money'}
        netAmount: {$ref: '#/components/schemas/Money'}
        currency: {type: string, enum: [VND]}
        status: {$ref: '#/components/schemas/PayoutStatus'}
        attemptCount: {type: integer, minimum: 0}
        recipientAccountLast4: {type: string, pattern: '^\d{4}$', nullable: true}
        providerReference: {type: string, nullable: true}
        createdAt: {type: string, format: date-time, description: Persisted audit date used by list date filters.}
    HistoryStep:
      type: object
      required: [id, event, fromStatus, toStatus, attemptNo, amount, sellerBankId, recipientAccountLast4, provider, providerReference, providerStatus, errorCode, errorMessage, simulated, actorId, occurredAt]
      properties:
        id: {type: string, format: uuid}
        event: {type: string, enum: [CREATED, HELD, RELEASED, SENT, SUCCEEDED, FAILED, TIMED_OUT, RECONCILED, RETRIED, RETURNED]}
        fromStatus: {type: string, nullable: true, enum: [null, ON_HOLD, PENDING, PROCESSING, UNKNOWN, SUCCEEDED, FAILED, RETURNED]}
        toStatus: {$ref: '#/components/schemas/PayoutStatus'}
        attemptNo: {type: integer, minimum: 0}
        amount: {$ref: '#/components/schemas/Money'}
        sellerBankId: {type: string, format: uuid, nullable: true}
        recipientAccountLast4: {type: string, pattern: '^\d{4}$', nullable: true}
        provider: {type: string, nullable: true}
        providerReference: {type: string, nullable: true}
        providerStatus: {type: string, nullable: true}
        errorCode: {type: string, nullable: true}
        errorMessage: {type: string, nullable: true}
        simulated: {type: boolean, description: Every sandbox provider step is labelled true; never present it as a real transfer.}
        actorId: {type: string, format: uuid, description: System UUID for automatic steps, administrator UUID for retry.}
        occurredAt: {type: string, format: date-time}
