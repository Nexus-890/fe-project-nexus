components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "RS256 access JWT, issuer user-service, audience nexus-services. privileges are exact SRS strings; roles are mapped as ROLE_<code>."
  schemas:
    Problem:
      type: "object"
      required:
        - "type"
        - "title"
        - "status"
        - "detail"
        - "instance"
        - "code"
      properties:
        type:
          type: "string"
          format: "uri-reference"
        title:
          type: "string"
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        detail:
          type: "string"
        instance:
          type: "string"
          format: "uri-reference"
        code:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Stable symbolic identifier. Branch on code and status; tolerate future unknown codes."
        traceId:
          type: "string"
          pattern: "\\S"
          minLength: 1
          description: "Active trace/correlation identifier when available; optional without tracing."
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ValidationError"
    ValidationError:
      type: "object"
      required:
        - "field"
        - "code"
        - "detail"
      properties:
        field:
          type: "string"
          description: "Failed request field; an object-level failure uses the object name."
        code:
          type: "string"
          description: "Constraint identifier, for example VALIDATION_NOT_BLANK, VALIDATION_EMAIL, VALIDATION_SIZE or INVALID_PARAMETER."
        detail:
          type: "string"
    PageInfo:
      type: "object"
      required:
        - "number"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        number:
          type: "integer"
          minimum: 0
        size:
          type: "integer"
          minimum: 1
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    User:
      type: "object"
      required:
        - "id"
        - "email"
        - "phone"
        - "fullName"
        - "gender"
        - "address"
        - "dateOfBirth"
        - "roles"
        - "status"
        - "createdAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
          maxLength: 255
        phone:
          type: "string"
        fullName:
          type: "string"
        gender:
          type: "string"
          enum:
            - "MALE"
            - "FEMALE"
            - "OTHER"
          nullable: true
        address:
          type: "string"
          nullable: true
        dateOfBirth:
          type: "string"
          format: "date"
          nullable: true
        roles:
          type: "array"
          items:
            type: "string"
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "LOCKED"
            - "DELETED"
        createdAt:
          type: "string"
          format: "date-time"
    Register:
      type: "object"
      required:
        - "email"
        - "phone"
        - "password"
        - "fullName"
        - "identityNumber"
        - "gender"
        - "address"
        - "dateOfBirth"
      properties:
        email:
          type: "string"
          pattern: "\\S"
          format: "email"
          minLength: 1
          maxLength: 255
          description: "Trimmed and normalized to lower case."
        phone:
          type: "string"
          pattern: "^\\+?[0-9]{7,15}$"
          description: "Whitespace, parentheses and hyphens are removed before validation."
        password:
          type: "string"
          pattern: "\\S"
          format: "password"
          minLength: 8
          description: "At least 8 characters. Sent only to Keycloak, which applies the realm password policy; user-service stores no password."
        fullName:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 150
        identityNumber:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 255
        gender:
          type: "string"
          enum:
            - "MALE"
            - "FEMALE"
            - "OTHER"
        address:
          type: "string"
          pattern: "\\S"
          minLength: 1
        dateOfBirth:
          type: "string"
          format: "date"
          description: "Valid yyyy-MM-dd date; must not be in the future in the service clock."
    UpdateProfile:
      type: "object"
      required: []
      properties:
        fullName:
          type: "string"
          pattern: "\\S"
          minLength: 1
          maxLength: 150
          description: "Trimmed. Omitted/null retains current value."
          nullable: true
        dateOfBirth:
          type: "string"
          format: "date"
          description: "Not in the future; omitted/null retains current value."
          nullable: true
        gender:
          type: "string"
          enum:
            - "MALE"
            - "FEMALE"
            - "OTHER"
          nullable: true
        address:
          type: "string"
          description: "Trimmed. Omitted/null retains current value."
          nullable: true
        email:
          type: "string"
          pattern: "\\S"
          format: "email"
          minLength: 1
          maxLength: 255
          description: "Trimmed and lowercased. Omitted/null retains current value."
          nullable: true
      description: "Only listed editable fields are consumed. Unknown properties are ignored; callers cannot change roles, status, phone or identity number through this API."
    RegisterResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
          description: "Numeric success code; omitted or null values default to 0 during response construction. Explicit values are preserved."
        message:
          type: "string"
          default: "response success"
          description: "Omitted or null values default to response success during response construction. Explicit messages are preserved."
        data:
          $ref: "#/components/schemas/User"
      additionalProperties: false
    GetOwnProfileResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
          description: "Numeric success code; omitted or null values default to 0 during response construction. Explicit values are preserved."
        message:
          type: "string"
          default: "response success"
          description: "Omitted or null values default to response success during response construction. Explicit messages are preserved."
        data:
          $ref: "#/components/schemas/User"
      additionalProperties: false
    UpdateOwnProfileResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
          description: "Numeric success code; omitted or null values default to 0 during response construction. Explicit values are preserved."
        message:
          type: "string"
          default: "response success"
          description: "Omitted or null values default to response success during response construction. Explicit messages are preserved."
        data:
          $ref: "#/components/schemas/User"
      additionalProperties: false
    GetUserResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
      properties:
        code:
          type: "integer"
          default: 0
          description: "Numeric success code; omitted or null values default to 0 during response construction. Explicit values are preserved."
        message:
          type: "string"
          default: "response success"
          description: "Omitted or null values default to response success during response construction. Explicit messages are preserved."
        data:
          $ref: "#/components/schemas/User"
      additionalProperties: false
    ListUsersResponse:
      type: "object"
      required:
        - "code"
        - "message"
        - "data"
        - "page"
      properties:
        code:
          type: "integer"
          default: 0
          description: "Numeric success code; omitted or null values default to 0 during response construction. Explicit values are preserved."
        message:
          type: "string"
          default: "response success"
          description: "Omitted or null values default to response success during response construction. Explicit messages are preserved."
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/User"
        page:
          $ref: "#/components/schemas/PageInfo"
      additionalProperties: false
    AdminCreateUser:
      type: object
      required:
        - email
        - phone
        - password
        - fullName
        - identityNumber
        - gender
        - address
        - dateOfBirth
        - roleCodes
      properties:
        email:
          type: string
          pattern: \S
          format: email
          minLength: 1
          maxLength: 255
          description: Trimmed and normalized to lower case.
        phone:
          type: string
          pattern: ^\+?[0-9]{7,15}$
          description: Whitespace, parentheses and hyphens are removed before validation.
        password:
          type: string
          pattern: \S
          format: password
          minLength: 8
          description: At least 8 characters. Sent only to Keycloak, which applies the realm password policy; user-service stores no password.
        fullName:
          type: string
          pattern: \S
          minLength: 1
          maxLength: 150
        identityNumber:
          type: string
          pattern: \S
          minLength: 1
          maxLength: 255
        gender:
          type: string
          enum:
            - MALE
            - FEMALE
            - OTHER
        address:
          type: string
          pattern: \S
          minLength: 1
        dateOfBirth:
          type: string
          format: date
          description: Valid yyyy-MM-dd date; must not be in the future in the service clock.
        roleCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - ADMIN
              - SUPPORT_STAFF
              - BUYER
              - SELLER
    AssignRoles:
      type: object
      required:
        - roleCodes
      properties:
        roleCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - ADMIN
              - SUPPORT_STAFF
              - BUYER
              - SELLER
    AdminPassword:
      type: object
      required:
        - newPassword
      properties:
        newPassword:
          type: string
          minLength: 8
          writeOnly: true
    Permission:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
    Role:
      type: object
      required:
        - id
        - code
        - name
        - privileges
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        privileges:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    RoleListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        page:
          $ref: "#/components/schemas/PageInfo"
    RoleDetailResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          $ref: "#/components/schemas/Role"
    PermissionListResponse:
      type: object
      required:
        - code
        - message
        - data
        - page
      properties:
        code:
          type: integer
          default: 0
        message:
          type: string
          default: response success
        data:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        page:
          $ref: "#/components/schemas/PageInfo"

x-service: "user-service"
x-business-error-codes:
  USER_ROLE_INVALID:
    status: 400
    detail: Role must belong to the fixed application role set
  USER_ROLE_NOT_FOUND:
    status: 404
    detail: Role not found
  USER_ACCOUNT_NOT_LOCKED:
    status: 409
    detail: Account is not locked by brute-force detection
  USER_IDENTITY_NOT_FOUND:
    status: 409
    detail: Profile has no corresponding identity-provider account
  USER_REGISTRATION_DISABLED:
    status: 403
    detail: "Self-registration is disabled"
  USER_NOT_FOUND:
    status: 404
    detail: "User not found"
  USER_EMAIL_ALREADY_USED:
    status: 409
    detail: "email is already used"
  USER_PHONE_ALREADY_USED:
    status: 409
    detail: "phone is already used"
  USER_IDENTITY_NUMBER_ALREADY_USED:
    status: 409
    detail: "identityNumber is already used"
  USER_PROFILE_CONFLICT:
    status: 409
    detail: "Email or phone is already used"
  USER_REGISTRATION_ROLE_UNAVAILABLE:
    status: 503
    detail: "Default registration role is unavailable"
  USER_IDENTITY_REJECTED:
    status: 400
    detail: "The identity provider rejected the account details"
  USER_IDENTITY_PROVIDER_UNAVAILABLE:
    status: 503
    detail: "The identity provider is unavailable"
