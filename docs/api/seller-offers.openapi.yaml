openapi: 3.0.3
info:
  title: Proposed seller second-chance offers
  version: 0.2.0-draft
  description: >-
    Seller routes and OFFERED/ACCEPTED/DECLINED/EXPIRED lifecycle follow issue #208.
    The owner-state response below is a frontend integration proposal for candidate
    preview and eligibility, pending the backend DTO. Issue #208 specifies an owner
    history list, but does not define these candidate-preview metadata fields.
    No version or If-Match precondition is required. No #208 controller or DTO is
    delivered by develop.
    This document does not change the endpoint catalogue, gateway policy or
    generated delivered DTOs. Production calls fail visibly when unavailable.
    The explicit local Postman simulation models this proposal only.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /api/v1/auctions/{id}/second-chance-offers:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getSellerSecondChanceOffers
      summary: Inspect the next eligible bidder and offer history
      description: >-
        Role SELLER and auction ownership are required.
        Read-only; sends no email or notification and creates no offer. Only
        PAYMENT_TIMEOUT auctions may offer. The server selects the next eligible
        bidder at that bidder's own highest valid bid, excluding the timed-out
        original winner and all previously offered bidders. It never reuses the
        original winning price. One OFFERED offer at most. canOffer is true exactly
        when candidate is non-null; an OFFERED offer makes candidate null. ACCEPTED
        history does not block progression: if its order misses payment and the
        auction returns to PAYMENT_TIMEOUT, the next never-offered bidder may be
        offered explicitly. Multiple historical ACCEPTED offers may coexist with
        a new candidate or OFFERED offer. Eligibility is a current server decision,
        never inferred from accepted history or the browser clock. Offers are newest first.
      responses:
        '200': {$ref: '#/components/responses/State'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: sendSellerSecondChanceOffer
      summary: Explicitly offer to the reviewed next bidder
      description: >-
        Bodyless POST, with the same proposed role/ownership rule as GET. Never
        accepts a bidder ID, price or email from the caller. Within one transaction,
        recheck PAYMENT_TIMEOUT and absence of an OFFERED row, then select the next
        eligible never-offered bidder and create one OFFERED offer at their own
        highest bid. The server writes one notification intent for that bidder.
        No automatic POST retry. The confirmation preview does not bind the
        bodyless request to a caller-supplied candidate; the server owns selection.
        Decline/expiry closes the offer and lets the seller explicitly choose to
        offer to the following eligible bidder; neither transition sends another
        email. Accept creates one order at the offered amount with a fresh payment
        deadline; PAYMENT_TIMEOUT moves to WON, then the normal auction-order flow
        creates its order and moves to SETTLED. If the new winner also misses the
        payment deadline, #208 returns the auction to PAYMENT_TIMEOUT and the
        seller may offer again while preserving the earlier ACCEPTED row.
        The timed-out original winner cannot reclaim the auction. Buyer responses,
        order creation, scheduling, settlement and notifications belong to #208
        and its related backend issues; this seller UI implements no such writes.
      responses:
        '201': {$ref: '#/components/responses/State'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Auction is not PAYMENT_TIMEOUT, an OFFERED row exists or no eligible next bidder remains. No offer/notification is created.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    State:
      description: Complete owner-scoped state; numeric wire amounts in VND.
      content:
        application/json:
          schema:
            type: object
            required: [code, message, data]
            properties:
              code: {type: integer, example: 0}
              message: {type: string, example: response success}
              data: {$ref: '#/components/schemas/OfferState'}
    BadRequest:
      description: Invalid ID or unexpected request body.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Bearer missing or invalid.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: SELLER role or auction ownership missing.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Auction missing, or this proposed capability has not been delivered.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: Service unavailable; no successful outcome may be inferred.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Candidate:
      type: object
      required: [bidderId, displayName, amount]
      properties:
        bidderId: {type: string, format: uuid}
        displayName: {type: string, minLength: 1, description: Server-provided masked bidder name; never an email address.}
        amount: {type: number, minimum: 0.01, maximum: 9999999999999.99, multipleOf: 0.01, description: This bidder's own highest valid bid in VND.}
    Offer:
      allOf:
        - {$ref: '#/components/schemas/Candidate'}
        - type: object
          required: [id, status, offeredAt, expiresAt, respondedAt, orderId, paymentDueAt]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [OFFERED, ACCEPTED, DECLINED, EXPIRED]}
            offeredAt: {type: string, format: date-time}
            expiresAt: {type: string, format: date-time, description: Server-controlled expiry; nexus.auction.second-chance-offer-hours defaults to 24.}
            respondedAt: {type: string, format: date-time, nullable: true, description: Non-null for ACCEPTED/DECLINED only.}
            orderId: {type: string, format: uuid, nullable: true, description: Non-null for ACCEPTED only.}
            paymentDueAt: {type: string, format: date-time, nullable: true, description: Fresh deadline later than accepted respondedAt; ACCEPTED only.}
    OfferState:
      type: object
      required: [auctionId, canOffer, candidate, offers]
      properties:
        auctionId: {type: string, format: uuid}
        canOffer: {type: boolean}
        candidate:
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/Candidate'}
        offers:
          type: array
          description: Unique offer IDs and bidder IDs; at most one OFFERED row. ACCEPTED rows are historical and may coexist with a new candidate, OFFERED row or subsequent ACCEPTED rows.
          items: {$ref: '#/components/schemas/Offer'}
    Problem:
      type: object
      required: [title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
